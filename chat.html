<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>پیام‌رسان</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f1f5f9; --panel:#fff; --panel2:#f8fafc; --text:#1e293b; --text2:#64748b;
  --border:#e2e8f0; --primary:#6366f1; --primary2:#8b5cf6; --bubble-in:#fff; --bubble-out:#6366f1;
}
.dark{
  --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --text:#f1f5f9; --text2:#94a3b8;
  --border:#334155; --bubble-in:#334155; --bubble-out:#6366f1;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:var(--bg);color:var(--text);
  transition:background .2s,color .2s;
}
button,input,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
input,textarea{outline:none;font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:6px}
.dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}

#app{display:flex;height:100vh;height:100dvh}
#sidebar{
  width:340px;flex-shrink:0;background:var(--panel);
  border-left:1px solid var(--border);display:flex;flex-direction:column;
}
#main{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative}

.hdr{padding:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.avatar{
  width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;overflow:hidden;flex-shrink:0;position:relative;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:36px;height:36px;font-size:13px}
.avatar.lg{width:88px;height:88px;font-size:34px}
.online-dot{
  position:absolute;bottom:1px;left:1px;width:12px;height:12px;
  background:#22c55e;border-radius:50%;border:2px solid var(--panel);
}
.search-inp{flex:1;padding:10px 14px;border-radius:22px;border:none;background:var(--panel2);color:var(--text);font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--panel2)}
.primary-btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}

#chatList{flex:1;overflow-y:auto;overflow-x:hidden}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--border)}
.chat-item:hover{background:var(--panel2)}
.chat-item.active{background:var(--panel2)}
.chat-item .info{flex:1;min-width:0}
.chat-item .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-item .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .time{font-size:11px;color:var(--text2);flex-shrink:0}
.chat-item .last{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badge{background:var(--primary);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px;min-width:20px;text-align:center}

#chatWin{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
#chatHeader{padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
#chatHeader .info{flex:1;min-width:0;cursor:pointer}
#chatHeader .name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHeader .sub{font-size:12px;color:var(--text2)}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg-row{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.msg-row.self{justify-content:flex-start;flex-direction:row-reverse}
.bubble{padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.45;word-break:break-word;position:relative;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg-row.self .bubble{background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px}
.msg-row:not(.self) .bubble{background:var(--bubble-in);color:var(--text);border-bottom-left-radius:4px}
.bubble .sender{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:3px;display:block}
.bubble .meta{font-size:10px;opacity:.65;margin-top:3px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.msg-row.self .bubble .meta{color:rgba(255,255,255,.9)}
.bubble img,.bubble video{max-width:280px;max-height:320px;border-radius:10px;display:block;margin:2px 0;cursor:pointer}
.bubble audio{width:260px;max-width:100%;display:block;margin:4px 0}
.msg-row.self .bubble audio{filter:brightness(1.1)}
.bubble .file-link{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.05);border-radius:8px;text-decoration:none;color:inherit;font-size:13px}
.msg-row.self .bubble .file-link{background:rgba(255,255,255,.15)}
.bubble.deleted{opacity:.6;font-style:italic}
.msg-actions{display:flex;gap:4px;opacity:0;transition:.15s}
.msg-row:hover .msg-actions{opacity:1}
.msg-actions button{width:28px;height:28px;border-radius:50%;background:var(--panel2);font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.msg-actions button:hover{background:var(--border);color:var(--text)}

#composer{padding:10px 12px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;flex-shrink:0;position:relative}
#composer textarea{flex:1;padding:10px 14px;border-radius:20px;border:none;resize:none;background:var(--panel2);color:var(--text);font-size:14px;max-height:120px;min-height:40px;line-height:1.4}
.send-btn{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s}
.send-btn:hover:not(:disabled){transform:scale(1.05)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

.mic-btn{color:var(--primary);transition:.15s}
.mic-btn:hover{background:var(--panel2)}
.mic-btn.recording{background:#ef4444;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}
  50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}
}
#recordingBar{
  position:absolute;inset:0;background:var(--panel);display:none;
  align-items:center;gap:12px;padding:0 16px;z-index:10;
}
#recordingBar.show{display:flex}
.rec-dot{width:12px;height:12px;border-radius:50%;background:#ef4444;animation:pulse 1.2s infinite;flex-shrink:0}
.rec-timer{font-size:16px;font-weight:700;color:#ef4444;font-variant-numeric:tabular-nums;min-width:60px}
.rec-wave{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;height:40px}
.rec-wave span{
  width:3px;background:var(--primary);border-radius:3px;height:20%;
  animation:wave 1s infinite ease-in-out;
}
.rec-wave span:nth-child(2){animation-delay:.1s}
.rec-wave span:nth-child(3){animation-delay:.2s}
.rec-wave span:nth-child(4){animation-delay:.3s}
.rec-wave span:nth-child(5){animation-delay:.4s}
.rec-wave span:nth-child(6){animation-delay:.5s}
.rec-wave span:nth-child(7){animation-delay:.6s}
@keyframes wave{0%,100%{height:20%}50%{height:100%}}
.rec-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;transition:.15s;flex-shrink:0}
.rec-btn.cancel{background:var(--panel2);color:#ef4444}
.rec-btn.send{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:12px;padding:30px;text-align:center}
.empty .big{font-size:60px;opacity:.4}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:20px;width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .25s cubic-bezier(.4,0,.2,1)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hdr{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-hdr h3{font-size:17px}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.modal-ftr{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:11px 14px;border-radius:10px;border:2px solid var(--border);background:var(--panel2);color:var(--text);font-size:14px;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);background:var(--panel)}
.btn{padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.4)}
.btn-ghost{background:var(--panel2);color:var(--text)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}

.tabs{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2);transition:.15s}
.tabs button.active{background:var(--panel);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}

.result-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:.15s}
.result-item:hover{background:var(--panel2)}
.result-item.selected{background:rgba(99,102,241,.1);border:1px solid var(--primary)}
.result-item .info{flex:1;min-width:0}
.result-item .n{font-weight:600;font-size:14px}
.result-item .u{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--text);color:var(--panel);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}

.upload-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--border);overflow:hidden;border-radius:3px 3px 0 0;z-index:20}
.upload-bar .fill{height:100%;background:var(--primary);width:0%;transition:width .2s}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#lightbox img,#lightbox video{max-width:100%;max-height:90vh;border-radius:8px}
#lightbox .close{position:absolute;top:16px;left:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}

#backBtn{display:none}
.typing-indicator{padding:6px 14px;font-size:12px;color:var(--text2);height:22px;flex-shrink:0}

@media(max-width:768px){
  #sidebar{width:100%}
  #main{position:fixed;inset:0;z-index:50;display:none}
  body.chat-open #sidebar{display:none}
  body.chat-open #main{display:flex}
  #backBtn{display:flex}
  .bubble img,.bubble video{max-width:220px}
  .bubble audio{width:220px}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="hdr">
      <div class="avatar" id="myAvatar" onclick="openProfile()" style="cursor:pointer">؟</div>
      <input class="search-inp" id="searchChats" placeholder="جستجوی چت…" oninput="renderChats()">
      <button class="icon-btn primary-btn" onclick="openNewChat()" title="چت جدید">+</button>
    </div>
    <div id="chatList"></div>
    <div class="hdr" style="border-top:1px solid var(--border);border-bottom:none;justify-content:space-between">
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="تم">🌙</button>
      <div style="display:flex;gap:4px">
        <button class="icon-btn" onclick="openProfile()" title="پروفایل">👤</button>
        <button class="icon-btn" onclick="logout()" title="حذف حساب" style="color:#ef4444">⏻</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="emptyMain" class="empty">
      <div class="big">💬</div>
      <div>یک چت انتخاب کن یا چت جدید بساز</div>
    </div>

    <div id="chatWin" style="display:none">
      <div id="chatHeader">
        <button class="icon-btn" id="backBtn" onclick="closeChat()">→</button>
        <div class="avatar sm" id="chatAvatar"></div>
        <div class="info" onclick="openChatInfo()">
          <div class="name" id="chatName">—</div>
          <div class="sub" id="chatSub">—</div>
        </div>
        <button class="icon-btn" onclick="openChatInfo()" title="اطلاعات">ⓘ</button>
      </div>
      <div id="messages"></div>
      <div class="typing-indicator" id="typingBox"></div>

      <div id="composer">
        <div id="recordingBar">
          <div class="rec-dot"></div>
          <div class="rec-timer" id="recTimer">00:00</div>
          <div class="rec-wave">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <button class="rec-btn cancel" onclick="cancelRecording()" title="لغو">🗑</button>
          <button class="rec-btn send" onclick="stopRecording(true)" title="ارسال">➤</button>
        </div>

        <button class="icon-btn" onclick="openAttach()" title="پیوست">📎</button>
        <button class="icon-btn mic-btn" id="micBtn" onclick="startRecording()" title="ضبط صدا">🎤</button>
        <textarea id="msgInput" placeholder="پیام…" rows="1" oninput="autoGrow(this)" onkeydown="composerKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="lightbox" onclick="closeLightbox()">
  <button class="close">✕</button>
  <div id="lightboxContent"></div>
</div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════
let sb = null;
let me = null;
let chats = [];
let activeChat = null;
let activeMessages = [];
let onlineUsers = new Set();
let realtimeChans = [];
let unread = {};
let groupSelected = [];
let typingTimeout = null;
let typingChannel = null;
let typingTimers = {};

// 🎤 Recording state
let mediaRecorder = null;
let recordedChunks = [];
let recordStartTime = 0;
let recordTimerInterval = null;
let recordStream = null;

// ═══════════════════════════════════════════════════════
//  SDK Load
// ═══════════════════════════════════════════════════════
(function loadSDK(){
  if (window.supabase) return init();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload = init;
  s.onerror = () => alert('خطا در بارگذاری SDK');
  document.head.appendChild(s);
})();

// ═══════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════
async function init(){
  try {
    const { createClient } = window.supabase;
    sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'messenger-auth' },
      realtime: { params: { eventsPerSecond: 30 } }
    });

    const { data: { session } } = await sb.auth.getSession();
    if (!session) return location.replace('index.html');

    const { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (error || !prof) {
      console.error('Profile load error:', error);
      await sb.auth.signOut();
      return location.replace('index.html');
    }
    me = prof;

    if ('Notification' in window && Notification.permission === 'default') {
      setTimeout(() => Notification.requestPermission(), 2000);
    }

    const savedTheme = me.theme || localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeBtn').textContent = '☀️';
    }

    renderMyAvatar();
    setupPresence();
    await loadChats();
    setupRealtime();

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    window.addEventListener('beforeunload', () => { try { sb.removeAllChannels(); } catch(e){} });

  } catch (e) {
    console.error('Init error:', e);
    alert('خطا: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════
//  Presence
// ═══════════════════════════════════════════════════════
async function setupPresence(){
  const ch = sb.channel('presence:global:' + me.id, {
    config: { presence: { key: me.id } }
  });
  ch.on('presence', { event: 'sync' }, () => {
    onlineUsers = new Set(Object.keys(ch.presenceState()));
    renderChats();
    updateChatHeaderStatus();
  });
  await ch.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await ch.track({ at: Date.now() });
  });
  realtimeChans.push(ch);
}

// ═══════════════════════════════════════════════════════
//  Load chats
// ═══════════════════════════════════════════════════════
async function loadChats(){
  const { data: rawChats, error } = await sb
    .from('chats').select('*')
    .contains('members', [me.id])
    .order('updated_at', { ascending: false });
  if (error) { console.error('loadChats:', error); return; }
  if (!rawChats || !rawChats.length) { chats = []; renderChats(); return; }

  const userIds = new Set();
  rawChats.forEach(c => (c.members || []).forEach(m => { if (m !== me.id) userIds.add(m); }));

  let profilesMap = {};
  if (userIds.size) {
    const { data: profs } = await sb.from('profiles')
      .select('id,name,username,avatar,online,last_seen')
      .in('id', [...userIds]);
    (profs || []).forEach(p => profilesMap[p.id] = p);
  }

  const chatIds = rawChats.map(c => c.id);
  let lastMsgs = {};
  if (chatIds.length) {
    const { data: msgs } = await sb.from('messages')
      .select('id,chat_id,sender,text,type,media,media_meta,deleted_for_everyone,created_at')
      .in('chat_id', chatIds)
      .order('created_at', { ascending: false });
    (msgs || []).forEach(m => { if (!lastMsgs[m.chat_id]) lastMsgs[m.chat_id] = m; });
  }

  chats = rawChats.map(c => {
    let title = c.name, avatar = c.avatar, otherId = null;
    if (c.type === 'private') {
      otherId = (c.members || []).find(m => m !== me.id);
      const p = profilesMap[otherId];
      title = p?.name || 'کاربر';
      avatar = p?.avatar || '';
    }
    return {
      ...c,
      _title: title || 'بدون نام',
      _avatar: avatar || '',
      _otherId: otherId,
      _lastMessage: lastMsgs[c.id] || null
    };
  });
  renderChats();
}

// ═══════════════════════════════════════════════════════
//  Realtime
// ═══════════════════════════════════════════════════════
function setupRealtime(){
  realtimeChans.forEach(c => { try { sb.removeChannel(c); } catch(e){} });
  realtimeChans = [];
  setupPresence();

  const ch = sb.channel('rt:messages:' + me.id);

  ch.on('postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'messages' },
    async (payload) => {
      const m = payload.new;
      if (m.deleted_for && m.deleted_for.includes(me.id)) return;

      let chat = chats.find(c => c.id === m.chat_id);
      if (!chat) {
        // چت جدید — ممکنه عضوم کرده باشن، پس دوباره بارگذاری کن
        await loadChats();
        chat = chats.find(c => c.id === m.chat_id);
        if (!chat) return;
      }

      let sender = null;
      if (m.sender === me.id) sender = { id: me.id, name: me.name, username: me.username, avatar: me.avatar };
      else {
        const { data: p } = await sb.from('profiles').select('id,name,username,avatar').eq('id', m.sender).single();
        sender = p || { id: m.sender, name: 'کاربر', username: '' };
      }
      m._sender = sender;

      chat._lastMessage = m;
      chat.updated_at = new Date().toISOString();

      if (!activeChat || m.chat_id !== activeChat.id) {
        if (m.sender !== me.id) unread[m.chat_id] = (unread[m.chat_id] || 0) + 1;
        chats = [chat, ...chats.filter(c => c.id !== chat.id)];
        if (m.sender !== me.id) notifyNewMessage(chat, m);
      }
      renderChats();

      if (activeChat && m.chat_id === activeChat.id) {
        if (!activeMessages.find(x => x.id === m.id)) {
          activeMessages.push(m);
          appendMessage(m);
          scrollToBottom();
        }
      }
    });

  ch.on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'messages' },
    (payload) => {
      const m = payload.new;
      const idx = activeMessages.findIndex(x => x.id === m.id);
      if (idx !== -1) {
        activeMessages[idx] = { ...activeMessages[idx], ...m };
        if (m.deleted_for_everyone) {
          const el = document.querySelector(`[data-msg="${m.id}"]`);
          if (el) el.outerHTML = deletedBubbleHTML(m);
        }
      }
      const c = chats.find(c => c.id === m.chat_id);
      if (c && c._lastMessage?.id === m.id) { c._lastMessage = m; renderChats(); }
    });

  // تغییرات چت‌ها (وقتی عضوی اضافه/حذف می‌شه)
  ch.on('postgres_changes',
    { event: 'UPDATE', schema: 'public', table: 'chats' },
    async (payload) => {
      const c = payload.new;
      // اگه من عضو شدم، دوباره بارگذاری
      if (c.members.includes(me.id)) {
        const exists = chats.find(x => x.id === c.id);
        if (!exists) await loadChats();
        else {
          const idx = chats.findIndex(x => x.id === c.id);
          if (idx !== -1) {
            chats[idx] = { ...chats[idx], ...c };
            renderChats();
          }
        }
      } else {
        // اگه من حذف شدم، از لیست بردار
        const idx = chats.findIndex(x => x.id === c.id);
        if (idx !== -1) {
          chats.splice(idx, 1);
          if (activeChat?.id === c.id) closeChat();
          renderChats();
        }
      }
    });

  ch.subscribe();
  realtimeChans.push(ch);
}

function notifyNewMessage(chat, m){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && activeChat?.id === chat.id) return;
  let body = '';
  if (m.deleted_for_everyone) body = 'پیام حذف شد';
  else if (m.type === 'text') body = (m.text || '').slice(0, 80);
  else if (m.type === 'image') body = '🖼 تصویر';
  else if (m.type === 'video') body = '🎬 ویدیو';
  else if (m.type === 'audio') body = '🎤 پیام صوتی';
  else body = '📎 فایل';
  try { new Notification(chat._title || 'پیام جدید', { body }); } catch(e){}
}

// ═══════════════════════════════════════════════════════
//  Render chat list
// ═══════════════════════════════════════════════════════
function renderChats(){
  const q = (document.getElementById('searchChats').value || '').toLowerCase().trim();
  const list = document.getElementById('chatList');
  const filtered = chats.filter(c => !q || (c._title || '').toLowerCase().includes(q));

  if (!filtered.length) {
    list.innerHTML = `<div class="empty" style="padding:40px 20px">
      <div class="big">🔍</div>
      <div>چتی پیدا نشد</div>
      <button class="btn btn-primary" onclick="openNewChat()" style="margin-top:8px">شروع چت جدید</button>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(c => {
    const last = c._lastMessage;
    let lastText = 'شروع گفتگو…';
    if (last) {
      if (last.deleted_for_everyone) lastText = '🚫 پیام حذف شد';
      else if (last.type === 'text') lastText = (last.sender === me.id ? 'شما: ' : '') + (last.text || '');
      else if (last.type === 'image') lastText = '🖼 تصویر';
      else if (last.type === 'video') lastText = '🎬 ویدیو';
      else if (last.type === 'audio') lastText = '🎤 پیام صوتی';
      else lastText = '📎 فایل';
    }
    const time = last ? formatTime(last.created_at) : '';
    const isOnline = c.type === 'private' && c._otherId && onlineUsers.has(c._otherId);
    const isActive = activeChat?.id === c.id;
    const cnt = unread[c.id] || 0;
    const avHTML = c._avatar
      ? `<img src="${escapeAttr(c._avatar)}" onerror="this.replaceWith(document.createTextNode('${escapeHtml((c._title||'?')[0])}'))">`
      : escapeHtml((c._title || '?')[0] || '?');
    const typeIcon = c.type === 'group' ? '👥 ' : c.type === 'channel' ? '📢 ' : '';

    return `
      <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${c.id}')">
        <div class="avatar">${avHTML}${isOnline ? '<span class="online-dot"></span>' : ''}</div>
        <div class="info">
          <div class="top">
            <div class="name">${typeIcon}${escapeHtml(c._title)}</div>
            <div class="time">${time}</div>
          </div>
          <div class="top" style="margin-top:3px">
            <div class="last">${escapeHtml(lastText).slice(0, 50)}</div>
            ${cnt > 0 ? `<div class="badge">${cnt > 99 ? '99+' : cnt}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderMyAvatar(){
  const el = document.getElementById('myAvatar');
  if (me.avatar) el.innerHTML = `<img src="${escapeAttr(me.avatar)}">`;
  else el.textContent = (me.name || '?')[0];
}

// ═══════════════════════════════════════════════════════
//  Open chat
// ═══════════════════════════════════════════════════════
async function openChat(chatId){
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;

  if (typingChannel) { try { sb.removeChannel(typingChannel); } catch(e){} typingChannel = null; }

  activeChat = chat;
  unread[chatId] = 0;
  renderChats();
  document.body.classList.add('chat-open');

  document.getElementById('emptyMain').style.display = 'none';
  document.getElementById('chatWin').style.display = 'flex';

  const av = document.getElementById('chatAvatar');
  if (chat._avatar) av.innerHTML = `<img src="${escapeAttr(chat._avatar)}">`;
  else av.textContent = (chat._title || '?')[0];
  document.getElementById('chatName').textContent = chat._title;
  updateChatHeaderStatus();

  const { data: msgs, error } = await sb.from('messages')
    .select('*').eq('chat_id', chatId)
    .order('created_at', { ascending: true })
    .limit(500);
  if (error) { toast('خطا: ' + error.message); return; }

  const senderIds = new Set(msgs.map(m => m.sender).filter(Boolean));
  let senders = {};
  if (senderIds.size) {
    const { data: profs } = await sb.from('profiles')
      .select('id,name,username,avatar').in('id', [...senderIds]);
    (profs || []).forEach(p => senders[p.id] = p);
  }

  activeMessages = msgs
    .map(m => ({ ...m, _sender: senders[m.sender] || { id: m.sender, name: 'کاربر' } }))
    .filter(m => !(m.deleted_for || []).includes(me.id));

  renderMessages();
  scrollToBottom();

  typingChannel = sb.channel('typing:' + chatId);
  typingChannel.on('broadcast', { event: 'typing' }, ({ payload }) => {
    if (payload.userId === me.id) return;
    const box = document.getElementById('typingBox');
    box.textContent = '✏️ در حال نوشتن…';
    clearTimeout(typingTimers[payload.userId]);
    typingTimers[payload.userId] = setTimeout(() => { box.textContent = ''; }, 2000);
  });
  typingChannel.subscribe();
}

function closeChat(){
  if (typingChannel) { try { sb.removeChannel(typingChannel); } catch(e){} typingChannel = null; }
  document.body.classList.remove('chat-open');
  activeChat = null;
  activeMessages = [];
  document.getElementById('chatWin').style.display = 'none';
  document.getElementById('emptyMain').style.display = 'flex';
  renderChats();
}

function updateChatHeaderStatus(){
  if (!activeChat) return;
  const el = document.getElementById('chatSub');
  if (activeChat.type === 'private') {
    el.textContent = onlineUsers.has(activeChat._otherId) ? 'آنلاین' : 'آفلاین';
  } else if (activeChat.type === 'group') {
    el.textContent = `${activeChat.members.length} عضو${activeChat.is_locked ? ' • 🔒' : ''}`;
  } else {
    el.textContent = `${activeChat.members.length} عضو • کانال`;
  }
}

// ═══════════════════════════════════════════════════════
//  Render messages
// ═══════════════════════════════════════════════════════
function renderMessages(){
  const el = document.getElementById('messages');
  if (!activeMessages.length) {
    el.innerHTML = `<div class="empty"><div class="big">👋</div><div>هنوز پیامی نیست</div></div>`;
    return;
  }
  el.innerHTML = activeMessages.map(m => messageHTML(m)).join('');
}

function messageHTML(m){
  if (m.deleted_for_everyone) return deletedBubbleHTML(m);
  const self = m.sender === me.id;
  const sender = m._sender || {};
  const time = formatClock(m.created_at);

  let content = '';
  if (m.type === 'text') {
    content = `<div>${linkify(escapeHtml(m.text || ''))}</div>`;
  } else if (m.type === 'image') {
    content = `<img src="${escapeAttr(m.media)}" onclick="openLightbox('image','${escapeAttr(m.media)}')" loading="lazy">`;
    if (m.text) content += `<div style="margin-top:4px">${escapeHtml(m.text)}</div>`;
  } else if (m.type === 'video') {
    content = `<video src="${escapeAttr(m.media)}" controls preload="metadata" onclick="event.stopPropagation()"></video>`;
    if (m.text) content += `<div style="margin-top:4px">${escapeHtml(m.text)}</div>`;
  } else if (m.type === 'audio') {
    const dur = m.media_meta?.duration ? formatDuration(m.media_meta.duration) : '';
    content = `<div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:20px">🎤</span>
      <audio src="${escapeAttr(m.media)}" controls preload="metadata" style="flex:1"></audio>
    </div>`;
    if (dur) content += `<div style="font-size:11px;opacity:.7;margin-top:2px">${dur}</div>`;
  } else {
    content = `<a href="${escapeAttr(m.media)}" download class="file-link" target="_blank">
      📎 <span>${escapeHtml(m.media_meta?.name || 'فایل')}</span>
      <span style="opacity:.6;font-size:11px">${formatSize(m.media_meta?.size)}</span>
    </a>`;
  }

  const actions = `
    <div class="msg-actions">
      ${m.text ? `<button onclick="event.stopPropagation();copyMsg('${m.id}')" title="کپی">📋</button>` : ''}
      <button onclick="event.stopPropagation();deleteForMe('${m.id}')" title="حذف برای من">🗑</button>
      ${self ? `<button onclick="event.stopPropagation();deleteForAll('${m.id}')" title="حذف برای همه">🗑️</button>` : ''}
    </div>`;

  const senderName = (!self && activeChat.type !== 'private' && sender.name)
    ? `<span class="sender">${escapeHtml(sender.name)}</span>` : '';

  return `
    <div class="msg-row ${self ? 'self' : ''}" data-msg="${m.id}">
      ${!self ? `<div class="avatar sm">${sender.avatar ? `<img src="${escapeAttr(sender.avatar)}">` : escapeHtml((sender.name || '?')[0])}</div>` : ''}
      <div class="bubble">
        ${senderName}
        ${content}
        <div class="meta">${time}</div>
      </div>
      ${actions}
    </div>`;
}

function deletedBubbleHTML(m){
  return `
    <div class="msg-row ${m.sender === me.id ? 'self' : ''}" data-msg="${m.id}">
      <div class="bubble deleted">🚫 این پیام حذف شد</div>
    </div>`;
}

function appendMessage(m){
  const el = document.getElementById('messages');
  const emp = el.querySelector('.empty');
  if (emp) emp.remove();
  const wrap = document.createElement('div');
  wrap.innerHTML = messageHTML(m);
  el.appendChild(wrap.firstElementChild);
}

function scrollToBottom(){
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// ═══════════════════════════════════════════════════════
//  Send message
// ═══════════════════════════════════════════════════════
async function sendMessage(){
  if (!activeChat) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoGrow(input);
  await sendPayload({ text, type: 'text', media: '', media_meta: {} });
}

async function sendPayload({ text, type, media, media_meta }){
  if (!activeChat) return;
  const clientId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
  const tempId = 'temp_' + clientId;
  const now = new Date().toISOString();

  const optimistic = {
    id: tempId, chat_id: activeChat.id, sender: me.id,
    text, type, media, media_meta,
    deleted_for_everyone: false, deleted_for: [], read_by: [],
    created_at: now, _sender: me
  };
  activeMessages.push(optimistic);
  appendMessage(optimistic);
  scrollToBottom();

  const chatId = activeChat.id;
  const { data, error } = await sb.from('messages').insert({
    chat_id: chatId, sender: me.id, text, type, media, media_meta, client_id: clientId
  }).select().single();

  if (error) {
    toast('ارسال نشد: ' + error.message);
    activeMessages = activeMessages.filter(m => m.id !== tempId);
    const node = document.querySelector(`[data-msg="${tempId}"]`);
    if (node) node.remove();
    return;
  }

  const idx = activeMessages.findIndex(m => m.id === tempId);
  if (idx !== -1) {
    data._sender = me;
    activeMessages[idx] = data;
    const node = document.querySelector(`[data-msg="${tempId}"]`);
    if (node) {
      const wrap = document.createElement('div');
      wrap.innerHTML = messageHTML(data);
      node.replaceWith(wrap.firstElementChild);
    }
  }

  const c = chats.find(c => c.id === chatId);
  if (c) {
    c._lastMessage = data;
    c.updated_at = now;
    chats = [c, ...chats.filter(x => x.id !== c.id)];
    renderChats();
  }
}

function composerKey(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  if (activeChat && typingChannel && !typingTimeout) {
    typingChannel.send({ type: 'broadcast', event: 'typing', payload: { userId: me.id, chatId: activeChat.id } });
    typingTimeout = setTimeout(() => { typingTimeout = null; }, 1500);
  }
}

function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ═══════════════════════════════════════════════════════
//  🎤 ضبط صدا
// ═══════════════════════════════════════════════════════
async function startRecording(){
  if (!activeChat) return toast('اول یک چت انتخاب کن');
  if (mediaRecorder && mediaRecorder.state === 'recording') return;

  try {
    recordStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/webm')
        ? 'audio/webm'
        : MediaRecorder.isTypeSupported('audio/mp4')
          ? 'audio/mp4'
          : '';

    const opts = mimeType ? { mimeType } : {};
    mediaRecorder = new MediaRecorder(recordStream, opts);
    recordedChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      if (recordStream) {
        recordStream.getTracks().forEach(t => t.stop());
        recordStream = null;
      }
    };

    mediaRecorder.start(100);

    recordStartTime = Date.now();
    document.getElementById('recordingBar').classList.add('show');
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('recTimer').textContent = '00:00';

    recordTimerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      document.getElementById('recTimer').textContent = `${m}:${s}`;
      if (elapsed >= 300) stopRecording(true);
    }, 200);

  } catch (e) {
    console.error('Recording error:', e);
    if (e.name === 'NotAllowedError') toast('دسترسی به میکروفون داده نشد');
    else if (e.name === 'NotFoundError') toast('میکروفون پیدا نشد');
    else toast('خطا: ' + e.message);
  }
}

async function stopRecording(send){
  if (!mediaRecorder) return;
  const wasRecording = mediaRecorder.state === 'recording';
  if (!wasRecording) return;

  const duration = Math.floor((Date.now() - recordStartTime) / 1000);
  mediaRecorder.stop();

  clearInterval(recordTimerInterval);
  recordTimerInterval = null;
  document.getElementById('recordingBar').classList.remove('show');
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('recTimer').textContent = '00:00';

  if (!send) { recordedChunks = []; return; }
  if (duration < 1) { toast('ضبط خیلی کوتاه است'); recordedChunks = []; return; }

  await new Promise(r => setTimeout(r, 150));

  if (!recordedChunks.length) { toast('صدایی ضبط نشد'); return; }

  const mimeType = mediaRecorder.mimeType || 'audio/webm';
  const ext = mimeType.includes('mp4') ? 'm4a' : mimeType.includes('ogg') ? 'ogg' : 'webm';
  const blob = new Blob(recordedChunks, { type: mimeType });
  recordedChunks = [];

  await uploadAudio(blob, ext, duration);
}

function cancelRecording(){
  stopRecording(false);
  toast('لغو شد');
}

async function uploadAudio(blob, ext, duration){
  const bar = document.createElement('div');
  bar.className = 'upload-bar';
  bar.innerHTML = '<div class="fill" style="width:20%"></div>';
  document.getElementById('composer').appendChild(bar);
  const fill = bar.querySelector('.fill');

  const path = `${me.id}/voice-${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  const { error } = await sb.storage.from('media').upload(path, blob, {
    cacheControl: '31536000', contentType: blob.type, upsert: false
  });

  fill.style.width = '100%';

  if (error) { bar.remove(); return toast('آپلود نشد: ' + error.message); }

  const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(path);
  setTimeout(() => bar.remove(), 300);

  await sendPayload({
    text: '',
    type: 'audio',
    media: publicUrl,
    media_meta: { duration, size: blob.size, mime: blob.type, name: 'voice.' + ext }
  });
}

function formatDuration(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

// ═══════════════════════════════════════════════════════
//  Message actions
// ═══════════════════════════════════════════════════════
function copyMsg(id){
  const m = activeMessages.find(x => x.id === id);
  if (!m || !m.text) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(m.text).then(() => toast('📋 کپی شد')).catch(() => toast('کپی نشد'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = m.text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('📋 کپی شد');
  }
}

async function deleteForMe(id){
  if (!confirm('حذف برای خودت؟')) return;
  const m = activeMessages.find(x => x.id === id);
  if (!m) return;
  const arr = [...(m.deleted_for || [])];
  if (!arr.includes(me.id)) arr.push(me.id);
  const { error } = await sb.from('messages').update({ deleted_for: arr }).eq('id', id);
  if (error) return toast(error.message);
  activeMessages = activeMessages.filter(x => x.id !== id);
  const node = document.querySelector(`[data-msg="${id}"]`);
  if (node) node.remove();
}

async function deleteForAll(id){
  if (!confirm('حذف برای همه؟')) return;
  const { error } = await sb.from('messages').update({
    deleted_for_everyone: true, text: '', media: ''
  }).eq('id', id);
  if (error) return toast(error.message);
  const m = activeMessages.find(x => x.id === id);
  if (m) { m.deleted_for_everyone = true; m.text = ''; m.media = ''; }
  const node = document.querySelector(`[data-msg="${id}"]`);
  if (node) node.outerHTML = deletedBubbleHTML({ id, sender: me.id });
}

// ═══════════════════════════════════════════════════════
//  Attach file
// ═══════════════════════════════════════════════════════
function openAttach(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,video/*,*/*';
  inp.onchange = async () => { if (inp.files[0]) await uploadAndSend(inp.files[0]); };
  inp.click();
}

async function uploadAndSend(file){
  const maxMB = window.MAX_FILE_MB || 500;
  if (file.size > maxMB * 1024 * 1024) return toast(`حجم بیش از ${maxMB}MB`);

  const bar = document.createElement('div');
  bar.className = 'upload-bar';
  bar.innerHTML = '<div class="fill"></div>';
  document.getElementById('composer').appendChild(bar);
  const fill = bar.querySelector('.fill');
  fill.style.width = '20%';

  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  const { error } = await sb.storage.from('media').upload(path, file, {
    cacheControl: '31536000', upsert: false
  });

  fill.style.width = '90%';

  if (error) { bar.remove(); return toast('آپلود نشد: ' + error.message); }

  const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(path);
  fill.style.width = '100%';
  setTimeout(() => bar.remove(), 300);

  let type = 'file';
  if (file.type.startsWith('image/')) type = 'image';
  else if (file.type.startsWith('video/')) type = 'video';
  else if (file.type.startsWith('audio/')) type = 'audio';

  await sendPayload({
    text: '',
    type,
    media: publicUrl,
    media_meta: { name: file.name, size: file.size, mime: file.type }
  });
}

function openModal(html){

// ═══════════════════════════════════════════════════════
//  Profile
// ═══════════════════════════════════════════════════════
function openProfile(){
  const html = `
    <div class="modal-hdr"><h3>پروفایل من</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="text-align:center;margin-bottom:20px">
        <div class="avatar lg" id="profileAvatarBox" style="margin:0 auto;cursor:pointer" onclick="changeAvatar()">
          ${me.avatar ? `<img src="${escapeAttr(me.avatar)}">` : escapeHtml((me.name||'?')[0])}
        </div>
        <div style="margin-top:8px;color:var(--text2);font-size:12px">برای تغییر کلیک کن</div>
      </div>
      <div class="field"><label>نام</label><input id="pName" value="${escapeAttr(me.name)}"></div>
      <div class="field"><label>نام کاربری</label><input id="pUsername" value="${escapeAttr(me.username)}"></div>
      <div class="field"><label>شماره موبایل</label><input value="${escapeAttr(me.phone||'')}" disabled></div>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="saveProfile()">ذخیره</button>
    </div>`;
  openModal(html);
}

async function changeAvatar(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) return toast('حداکثر 5MB');
    toast('در حال آپلود…');
    const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${me.id}/avatar-${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('avatars').upload(path, f, { upsert: true });
    if (error) return toast('آپلود نشد: ' + error.message);
    const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path);
    const { data, error: e2 } = await sb.from('profiles')
      .update({ avatar: publicUrl }).eq('id', me.id).select().single();
    if (e2) return toast('ذخیره نشد: ' + e2.message);
    me.avatar = publicUrl;
    renderMyAvatar();
    const box = document.getElementById('profileAvatarBox');
    if (box) box.innerHTML = `<img src="${escapeAttr(publicUrl)}">`;
    toast('✅ آواتار ذخیره شد');
  };
  inp.click();
}

async function saveProfile(){
  const name = document.getElementById('pName').value.trim();
  const username = document.getElementById('pUsername').value.trim().toLowerCase();

  if (!name) return toast('نام خالی است');
  if (!/^[a-z0-9_]{3,20}$/.test(username))
    return toast('نام کاربری: فقط a-z، 0-9 و _ ، ۳ تا ۲۰ کاراکتر');

  const { data, error } = await sb
    .from('profiles')
    .update({ name, username })
    .eq('id', me.id)
    .select();

  if (error) {
    if (error.code === '23505') return toast('این نام کاربری قبلاً گرفته شده');
    if (error.code === '42501') return toast('مجوز نداری (RLS)');
    return toast('خطا: ' + error.message);
  }

  if (!data || !data.length) return toast('⚠️ آپدیت انجام نشد — policy رو چک کن');

  me.name = data[0].name;
  me.username = data[0].username;
  me.avatar = data[0].avatar;
  renderMyAvatar();
  await loadChats();
  closeModal();
  toast('✅ ذخیره شد');
}

function openNewChat(){
  groupSelected = [];
  const html = `
    <div class="modal-hdr"><h3>شروع چت جدید</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="tabs">
        <button data-tab="user" class="active" onclick="switchNewTab('user')">کاربر</button>
        <button data-tab="group" onclick="switchNewTab('group')">گروه</button>
        <button data-tab="channel" onclick="switchNewTab('channel')">کانال</button>
      </div>
      <div id="newTabContent"></div>
    </div>`;
  openModal(html);
  switchNewTab('user');
}

function switchNewTab(tab){
  document.querySelectorAll('.tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  const c = document.getElementById('newTabContent');
  if (tab === 'user') c.innerHTML = userSearchHTML();
  else c.innerHTML = groupSearchHTML(tab);
  if (tab === 'user') setTimeout(() => document.getElementById('userSearchQ')?.focus(), 50);
  else {
    setTimeout(() => {
      document.getElementById('groupSearchQ')?.focus();
      searchGroups(tab);
    }, 50);
  }
}

function userSearchHTML(){
  return `
    <div class="field">
      <input id="userSearchQ" placeholder="جستجوی نام، نام کاربری یا شماره…" oninput="searchUsers()">

    <div id="userResults" style="max-height:340px;overflow-y:auto"></div>`;
}

      <div class="field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="gPublic" checked style="width:auto"> 🌐 عمومی (قابل جستجو و عضویت)</label></div>

async function searchUsers(){
  const q = document.getElementById('userSearchQ').value.trim();
  const box = document.getElementById('userResults');
  if (!q) { box.innerHTML = '<div style="color:var(--text2);font-size:13px;text-align:center;padding:20px">نام یا شماره را وارد کن</div>'; return; }
  const { data } = await sb.from('profiles')
    .select('id,name,username,phone,avatar')
    .neq('id', me.id)
    .or(`name.ilike.%${q}%,username.ilike.%${q}%,phone.ilike.%${q}%`)
    .limit(20);
  if (!data?.length) { box.innerHTML = '<div style="color:var(--text2);text-align:center;padding:20px">پیدا نشد</div>'; return; }
  box.innerHTML = data.map(u => `
    <div class="result-item" onclick="startPrivateChat('${u.id}')">
      <div class="avatar sm">${u.avatar ? `<img src="${escapeAttr(u.avatar)}">` : escapeHtml((u.name||'?')[0])}</div>
      <div class="info"><div class="n">${escapeHtml(u.name)}</div><div class="u">@${escapeHtml(u.username)} • ${escapeHtml(u.phone||'')}</div></div>
      <button class="btn btn-primary" style="padding:6px 12px;font-size:12px">شروع</button>
    </div>
  `).join('');
}

async function startPrivateChat(otherId){
  const { data: existing } = await sb.from('chats').select('*')
    .eq('type', 'private').contains('members', [me.id, otherId]);
  const found = (existing || []).find(c => c.members.length === 2 && c.members.includes(otherId));
  if (found) { closeModal(); await loadChats(); openChat(found.id); return; }

  const { data, error } = await sb.from('chats').insert({
    type: 'private', members: [me.id, otherId], owner: me.id,
    is_public: false, is_locked: true
  }).select().single();
  if (error) return toast(error.message);

  const newContacts = [...new Set([...(me.contacts || []), otherId])];
  await sb.from('profiles').update({ contacts: newContacts }).eq('id', me.id);
  me.contacts = newContacts;

  closeModal();
  await loadChats();
  openChat(data.id);
}

// 🔍 جستجوی گروه/کانال عمومی (با RPC)
async function searchGroups(type){
  const q = document.getElementById('groupSearchQ').value.trim();
  const box = document.getElementById('groupResults');
  box.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text2);font-size:13px">در حال جستجو…</div>';

  const { data, error } = await sb.rpc('search_public_chats', {
    p_query: q,
    p_type: type
  });

  if (error) {
    console.error('search error:', error);
    box.innerHTML = '<div style="color:#ef4444;text-align:center;padding:16px;font-size:13px">خطا در جستجو</div>';
    return;
  }

  if (!data || !data.length) {
    box.innerHTML = `<div style="color:var(--text2);text-align:center;padding:16px;font-size:13px">
      ${q ? 'چیزی پیدا نشد' : `هنوز ${type === 'group' ? 'گروه' : 'کانال'} عمومی ساخته نشده`}
    </div>`;
    return;
  }

  box.innerHTML = data.map(c => {
    const isMember = (c.members || []).includes(me.id);
    const canJoin = !c.is_locked && !isMember;
    return `
      <div class="result-item">
        <div class="avatar sm">${c.avatar ? `<img src="${escapeAttr(c.avatar)}">` : escapeHtml((c.name||'?')[0])}</div>
        <div class="info">
          <div class="n">${escapeHtml(c.name)} ${c.is_locked ? '🔒' : ''}</div>
          <div class="u">${(c.members||[]).length} عضو${c.description ? ' • ' + escapeHtml(c.description).slice(0,30) : ''}</div>
        </div>
        ${isMember
          ? `<button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="openExistingChat('${c.id}')">ورود</button>`
          : canJoin
            ? `<button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="joinGroup('${c.id}')">عضویت</button>`
            : `<span style="font-size:11px;color:var(--text2)">قفل</span>`
        }
      </div>`;
  }).join('');
}

// 🚪 عضویت در گروه/کانال عمومی (با RPC)
async function joinGroup(chatId){
  toast('در حال عضویت…');
  const { data, error } = await sb.rpc('join_public_chat', { p_chat_id: chatId });
  if (error) {
    console.error('join error:', error);
    return toast('عضویت نشد: ' + error.message);
  }
  toast('✅ عضو شدی');
  closeModal();
  await loadChats();
  openChat(chatId);
}

async function openExistingChat(chatId){
  closeModal();
  await loadChats();
  openChat(chatId);
}

async function searchGroupMembers(){
  const q = document.getElementById('gMemberSearch').value.trim();
  const box = document.getElementById('gMemberResults');
  if (!q) { box.innerHTML = ''; return; }
  const { data } = await sb.from('profiles')
    .select('id,name,username,avatar')
    .neq('id', me.id)
    .or(`name.ilike.%${q}%,username.ilike.%${q}%`)
    .limit(10);
  box.innerHTML = (data || []).map(u => {
    const sel = groupSelected.some(x => x.id === u.id);
    return `
      <div class="result-item ${sel ? 'selected' : ''}" onclick="toggleGroupMember('${u.id}', '${escapeAttr(u.name)}')">
        <div class="avatar sm">${u.avatar ? `<img src="${escapeAttr(u.avatar)}">` : escapeHtml((u.name||'?')[0])}</div>
        <div class="info"><div class="n">${escapeHtml(u.name)}</div><div class="u">@${escapeHtml(u.username)}</div></div>
        ${sel ? '<span>✓</span>' : ''}
      </div>`;
  }).join('');
}

function toggleGroupMember(id, name){
  if (groupSelected.some(x => x.id === id)) groupSelected = groupSelected.filter(x => x.id !== id);
  else groupSelected.push({ id, name });
  renderSelectedMembers();
  searchGroupMembers();
}

function removeGroupMember(id){
  groupSelected = groupSelected.filter(x => x.id !== id);
  renderSelectedMembers();
  searchGroupMembers();
}

function renderSelectedMembers(){
  document.getElementById('gSelected').innerHTML = groupSelected.map(x =>
    `<span class="chip">${escapeHtml(x.name)} <button onclick="removeGroupMember('${x.id}')">✕</button></span>`
  ).join('');
}

async function createGroup(type){
  const name = document.getElementById('gName').value.trim();
  const desc = document.getElementById('gDesc').value.trim();
  const locked = document.getElementById('gLocked').checked;
  const isPublic = document.getElementById('gPublic').checked;
  if (!name) return toast('نام را وارد کن');

  const memberIds = groupSelected.map(x => x.id);
  const { data, error } = await sb.from('chats').insert({
    type, name, description: desc,
    owner: me.id,
    members: [me.id, ...memberIds],
    admins: [me.id],
    is_locked: locked,
    is_public: isPublic
  }).select().single();
  if (error) return toast(error.message);
  groupSelected = [];
  closeModal();
  await loadChats();
  openChat(data.id);
  toast('✅ ساخته شد');
}

      ` : ''}

      ${c.type !== 'private' && isAdmin ? `<button class="btn btn-primary" onclick="saveChatInfo()">ذخیره</button>` : ''}
    </div>`;
  openModal(html);

async function renderMembersList(){
  if (!activeChat || activeChat.type === 'private') return;
  const { data: profs } = await sb.from('profiles')
    .select('id,name,username,avatar').in('id', activeChat.members);
  const box = document.getElementById('membersList');
  if (!box) return;
  box.innerHTML = (profs || []).map(p => {
    const isAdmin = activeChat.admins?.includes(p.id) || activeChat.owner === p.id;
    return `
      <div class="result-item">
        <div class="avatar sm">${p.avatar ? `<img src="${escapeAttr(p.avatar)}">` : escapeHtml((p.name||'?')[0])}</div>
        <div class="info"><div class="n">${escapeHtml(p.name)} ${p.id === me.id ? '(شما)' : ''} ${isAdmin ? '👑' : ''}</div><div class="u">@${escapeHtml(p.username)}</div></div>
      </div>`;
  }).join('');
}

async function changeChatAvatar(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast('در حال آپلود…');
    const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();

    if (error) return toast(error.message);
    const { data: { publicUrl } } = sb.storage.from('avatars').getPublicUrl(path);
    const { error: e2 } = await sb.from('chats').update({ avatar: publicUrl }).eq('id', activeChat.id);
    if (e2) return toast(e2.message);
    activeChat.avatar = publicUrl;
    activeChat._avatar = publicUrl;
    const box = document.getElementById('chatAvatarBox');
    if (box) box.innerHTML = `<img src="${escapeAttr(publicUrl)}">`;

    updateChatHeaderStatus();
    toast('✅ ذخیره شد');
  };

async function saveChatInfo(){
  const name = document.getElementById('ciName').value.trim();
  const desc = document.getElementById('ciDesc').value.trim();
  const locked = document.getElementById('ciLocked').checked;
  const isPublic = document.getElementById('ciPublic').checked;

    name, description: desc, is_locked: locked, is_public: isPublic
  }).eq('id', activeChat.id).select().single();

  activeChat.name = name;
  activeChat._title = name;
  activeChat.description = desc;
  activeChat.is_locked = locked;

  await loadChats();
  document.getElementById('chatName').textContent = name;

}

async function searchAddMember(){
  const q = document.getElementById('addMemberQ').value.trim();
  const box = document.getElementById('addMemberResults');
  if (!q) { box.innerHTML = ''; return; }
  const { data } = await sb.from('profiles')
    .select('id,name,username,avatar')
    .or(`name.ilike.%${q}%,username.ilike.%${q}%`)
    .limit(10);
  const filtered = (data || []).filter(u => !activeChat.members.includes(u.id));
  box.innerHTML = filtered.map(u => `
    <div class="result-item" onclick="addMemberToChat('${u.id}')">
      <div class="avatar sm">${u.avatar ? `<img src="${escapeAttr(u.avatar)}">` : escapeHtml((u.name||'?')[0])}</div>
      <div class="info"><div class="n">${escapeHtml(u.name)}</div><div class="u">@${escapeHtml(u.username)}</div></div>
      <button class="btn btn-primary" style="padding:6px 12px;font-size:12px">افزودن</button>
    </div>`).join('');
}

async function addMemberToChat(userId){
  if (activeChat.members.includes(userId)) return;
  const newMembers = [...activeChat.members, userId];
  const { error } = await sb.from('chats').update({ members: newMembers }).eq('id', activeChat.id);
  if (error) return toast(error.message);
  activeChat.members = newMembers;
  renderMembersList();
  document.getElementById('addMemberQ').value = '';
  document.getElementById('addMemberResults').innerHTML = '';
  await loadChats();
  updateChatHeaderStatus();
  toast('✅ افزوده شد');
}

// ═══════════════════════════════════════════════════════
//  🗑️ Logout + حذف کامل حساب
// ═══════════════════════════════════════════════════════
async function logout(){
  const ok = confirm(
    '⚠️ هشدار!\n\n' +
    'با این کار حساب شما کاملاً حذف می‌شود:\n' +
    '• پروفایل، آواتار، پیام‌ها و مخاطبین\n' +
    '• عضویت در گروه‌ها و کانال‌ها\n' +
    '• امکان بازیابی وجود ندارد\n\n' +
    'آیا مطمئنی؟'
  );
  if (!ok) return;

  const ok2 = confirm('آخرین تأیید — حساب کاملاً پاک شود؟');
  if (!ok2) return;

  toast('در حال حذف حساب…');

  try {
    try { await sb.removeAllChannels(); } catch(e){}

    try {
      const { data: files } = await sb.storage.from('avatars').list(me.id);
      if (files && files.length) {
        await sb.storage.from('avatars').remove(files.map(f => `${me.id}/${f.name}`));
      }
    } catch(e){}

    try {
      const { data: files } = await sb.storage.from('media').list(me.id);
      if (files && files.length) {
        await sb.storage.from('media').remove(files.map(f => `${me.id}/${f.name}`));
      }
    } catch(e){}

    const { error } = await sb.rpc('delete_my_account');
    if (error) {
      console.error('delete_my_account error:', error);
      toast('حذف نشد: ' + error.message);
      return;
    }

    await sb.auth.signOut();
    localStorage.removeItem('messenger-auth');
    localStorage.removeItem('theme');
    sessionStorage.clear();

    toast('✅ حساب حذف شد');
    setTimeout(() => location.replace('index.html'), 800);

  } catch (e) {
    console.error('Logout error:', e);
    toast('خطا: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════
//  Lightbox
// ═══════════════════════════════════════════════════════
function openLightbox(type, url){
  const l = document.getElementById('lightbox');
  const c = document.getElementById('lightboxContent');
  c.innerHTML = type === 'image'
    ? `<img src="${escapeAttr(url)}">`
    : `<video src="${escapeAttr(url)}" controls autoplay></video>`;
  l.style.display = 'flex';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightboxContent').innerHTML = '';
}

// ═══════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
function escapeAttr(s){ return escapeHtml(s); }
function linkify(s){
  return s.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:inherit;text-decoration:underline">$1</a>');
}
function formatClock(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
}
function formatTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'الان';
  if (diff < 3600) return Math.floor(diff/60) + 'د';
  if (d.toDateString() === now.toDateString()) return formatClock(iso);
  if (diff < 86400 * 2) return 'دیروز';
  return d.toLocaleDateString('fa-IR', { month: 'short', day: 'numeric' });
}
function formatSize(bytes){
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(1) + ' GB';
}
function toast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
