<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | StarChat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #060913;
            --panel: rgba(14, 18, 35, 0.9);
            --border: rgba(255,255,255,0.09);
            --text: #fff;
            --muted: #9aa3bd;
            --purple: #8668ff;
            --cyan: #31d9ff;
            --danger: #ff5f7a;
            --success: #43e7a6;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
            pointer-events: none;
        }

        body::before {
            top: -180px;
            left: -120px;
            background: #6949ff;
        }

        body::after {
            right: -150px;
            bottom: -180px;
            background: #00d5ff;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 28px;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: linear-gradient(
                135deg,
                var(--purple),
                var(--cyan)
            );
            font-size: 32px;
            font-weight: 900;
            box-shadow: 0 0 35px rgba(104,85,255,.3);
        }

        h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
        }

        .lock {
            display: none;
        }

        .login {
            display: block;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d7dcef;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 52px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.045);
            color: white;
            outline: none;
            padding: 0 15px;
            font-size: 14px;
        }

        input:focus {
            border-color: rgba(134,104,255,.65);
            box-shadow: 0 0 0 4px rgba(134,104,255,.08);
        }

        .pass {
            padding-left: 50px;
        }

        .toggle {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #aeb7cf;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(
                135deg,
                var(--purple),
                #557fff
            );
            margin-top: 4px;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .secondary {
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .info {
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            line-height: 1.8;
            margin-top: 15px;
        }

        .error {
            min-height: 20px;
            margin-top: 10px;
            text-align: center;
            color: var(--danger);
            font-size: 12px;
        }

        .success {
            min-height: 20px;
            margin-top: 10px;
            text-align: center;
            color: var(--success);
            font-size: 12px;
        }

        .center-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                rgba(134,104,255,.25),
                rgba(49,217,255,.18)
            );
            border: 1px solid rgba(255,255,255,.08);
            font-size: 36px;
        }

        .user-label {
            text-align: center;
            color: #c0c8db;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .links {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .links a {
            color: #b3a4ff;
            text-decoration: none;
            font-size: 12px;
        }

        .toast {
            position: fixed;
            left: 20px;
            bottom: 20px;
            max-width: calc(100vw - 40px);
            padding: 13px 15px;
            border-radius: 14px;
            background: rgba(13,17,31,.96);
            border: 1px solid var(--border);
            color: white;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px);
            transition: .25s;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

<main class="page">

    <section class="card">

        <!-- LOGIN -->
        <div id="loginBox" class="login">

            <div class="brand">
                <div class="logo">✦</div>
                <h1>StarChat</h1>
                <div class="sub">
                    ورود به پیام‌رسان StarLoom
                </div>
            </div>

            <form id="loginForm">

                <div class="field">
                    <label for="email">
                        ایمیل
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="field">

                    <label for="password">
                        رمز عبور
                    </label>

                    <div class="input-wrap">

                        <input
                            id="password"
                            class="pass"
                            type="password"
                            autocomplete="current-password"
                            placeholder="رمز عبور"
                            required
                        >

                        <button
                            type="button"
                            class="toggle"
                            id="togglePassword"
                        >◉</button>

                    </div>
                </div>

                <button
                    id="loginBtn"
                    class="btn"
                    type="submit"
                >
                    ورود
                </button>

            </form>

            <div id="loginMessage" class="error"></div>

            <div class="links">
                <a href="./index.html">
                    ساخت حساب جدید
                </a>
            </div>

        </div>


        <!-- LOCK -->
        <div id="lockBox" class="lock">

            <div class="brand">
                <div class="center-icon">
                    🔐
                </div>

                <h1>StarChat</h1>

                <div class="sub">
                    حساب شما روی این دستگاه فعال است
                </div>
            </div>

            <div
                id="lockUser"
                class="user-label"
            ></div>

            <form id="pinForm">

                <div class="field">

                    <label for="pin">
                        رمز ورود دستگاه
                    </label>

                    <div class="input-wrap">

                        <input
                            id="pin"
                            class="pass"
                            type="password"
                            inputmode="numeric"
                            autocomplete="off"
                            minlength="4"
                            maxlength="32"
                            placeholder="رمز یا PIN"
                            required
                        >

                        <button
                            type="button"
                            class="toggle"
                            id="togglePin"
                        >◉</button>

                    </div>
                </div>

                <button
                    class="btn"
                    type="submit"
                >
                    باز کردن StarChat
                </button>

            </form>

            <div
                id="pinMessage"
                class="error"
            ></div>

            <button
                id="changePinBtn"
                class="btn secondary"
                type="button"
            >
                تغییر رمز دستگاه
            </button>

            <button
                id="logoutBtn"
                class="btn secondary"
                type="button"
            >
                خروج کامل از حساب
            </button>

        </div>

    </section>

</main>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://xxxxx.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_PUBLISHABLE_KEY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* =========================================================
   STORAGE KEYS
   ========================================================= */

const PIN_HASH_KEY = "starchat_device_pin_hash";
const PIN_USER_KEY = "starchat_device_user_id";


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginBox = document.getElementById("loginBox");
const lockBox = document.getElementById("lockBox");

const loginForm = document.getElementById("loginForm");
const pinForm = document.getElementById("pinForm");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const pinInput = document.getElementById("pin");

const loginBtn = document.getElementById("loginBtn");

const loginMessage =
    document.getElementById("loginMessage");

const pinMessage =
    document.getElementById("pinMessage");

const lockUser =
    document.getElementById("lockUser");

const toast =
    document.getElementById("toast");


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function showToast(message) {

    clearTimeout(toastTimer);

    toast.textContent = message;
    toast.className = "toast show";

    toastTimer = setTimeout(() => {
        toast.className = "toast";
    }, 3500);
}


/* =========================================================
   SHA-256
   ========================================================= */

async function sha256(text) {

    const data =
        new TextEncoder().encode(text);

    const hashBuffer =
        await crypto.subtle.digest(
            "SHA-256",
            data
        );

    const hashArray =
        Array.from(new Uint8Array(hashBuffer));

    return hashArray
        .map(
            byte =>
                byte.toString(16).padStart(2, "0")
        )
        .join("");
}


/* =========================================================
   PASSWORD TOGGLE
   ========================================================= */

document
    .getElementById("togglePassword")
    .addEventListener("click", () => {

        passwordInput.type =
            passwordInput.type === "password"
                ? "text"
                : "password";
    });


document
    .getElementById("togglePin")
    .addEventListener("click", () => {

        pinInput.type =
            pinInput.type === "password"
                ? "text"
                : "password";
    });


/* =========================================================
   SHOW LOGIN
   ========================================================= */

function showLogin() {

    loginBox.style.display = "block";
    lockBox.style.display = "none";

    loginMessage.textContent = "";
    pinMessage.textContent = "";
}


/* =========================================================
   SHOW LOCK
   ========================================================= */

function showLock(session) {

    loginBox.style.display = "none";
    lockBox.style.display = "block";

    const user =
        session.user;

    const email =
        user.email || "کاربر StarChat";

    lockUser.textContent =
        email;

    pinInput.value = "";

    pinMessage.textContent = "";
}


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        loginBtn.disabled = true;
        loginBtn.textContent =
            "در حال ورود...";

        loginMessage.textContent = "";

        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {
                throw error;
            }

            const session =
                data.session;

            if (!session) {
                throw new Error(
                    "جلسه ورود ساخته نشد."
                );
            }

            const userId =
                session.user.id;

            const savedPinHash =
                localStorage.getItem(
                    PIN_HASH_KEY
                );

            const savedPinUser =
                localStorage.getItem(
                    PIN_USER_KEY
                );

            if (
                savedPinHash &&
                savedPinUser === userId
            ) {

                showLock(session);

            } else {

                /*
                 * حساب جدید روی این دستگاه
                 * باید رمز دستگاه تعیین کند.
                 */

                const pin =
                    prompt(
                        "برای قفل دستگاه یک رمز یا PIN انتخاب کن:"
                    );

                if (!pin || pin.length < 4) {

                    await supabaseClient.auth.signOut();

                    showLogin();

                    loginMessage.textContent =
                        "رمز دستگاه باید حداقل ۴ کاراکتر باشد.";

                    return;
                }

                const hash =
                    await sha256(pin);

                localStorage.setItem(
                    PIN_HASH_KEY,
                    hash
                );

                localStorage.setItem(
                    PIN_USER_KEY,
                    userId
                );

                window.location.href =
                    "./chat.html";
            }

        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );

            loginMessage.textContent =
                error?.message ||
                "ورود انجام نشد.";

        } finally {

            loginBtn.disabled = false;
            loginBtn.textContent =
                "ورود";
        }
    }
);


/* =========================================================
   PIN UNLOCK
   ========================================================= */

pinForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const pin =
            pinInput.value;

        const savedHash =
            localStorage.getItem(
                PIN_HASH_KEY
            );

        if (!savedHash) {

            pinMessage.textContent =
                "رمز دستگاه پیدا نشد.";

            return;
        }

        try {

            const hash =
                await sha256(pin);

            if (hash !== savedHash) {

                pinMessage.textContent =
                    "رمز دستگاه اشتباه است.";

                pinInput.value = "";

                return;
            }

            pinMessage.textContent =
                "";

            window.location.href =
                "./chat.html";

        } catch (error) {

            console.error(error);

            pinMessage.textContent =
                "خطا در باز کردن StarChat.";
        }
    }
);


/* =========================================================
   CHANGE DEVICE PIN
   ========================================================= */

document
    .getElementById("changePinBtn")
    .addEventListener("click", async () => {

        const oldPin =
            prompt(
                "رمز فعلی دستگاه را وارد کن:"
            );

        if (!oldPin) return;

        const oldHash =
            await sha256(oldPin);

        const savedHash =
            localStorage.getItem(
                PIN_HASH_KEY
            );

        if (oldHash !== savedHash) {

            showToast(
                "رمز فعلی اشتباه است."
            );

            return;
        }

        const newPin =
            prompt(
                "رمز جدید را وارد کن:"
            );

        if (!newPin || newPin.length < 4) {

            showToast(
                "رمز جدید باید حداقل ۴ کاراکتر باشد."
            );

            return;
        }

        const newHash =
            await sha256(newPin);

        localStorage.setItem(
            PIN_HASH_KEY,
            newHash
        );

        showToast(
            "رمز دستگاه با موفقیت تغییر کرد."
        );
    });


/* =========================================================
   COMPLETE LOGOUT
   ========================================================= */

document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        try {

            await supabaseClient.auth.signOut();

        } catch (error) {

            console.error(error);
        }

        localStorage.removeItem(
            PIN_HASH_KEY
        );

        localStorage.removeItem(
            PIN_USER_KEY
        );

        showLogin();

        emailInput.value = "";
        passwordInput.value = "";
        pinInput.value = "";

        showToast(
            "از حساب خارج شدی."
        );
    });


/* =========================================================
   INITIAL SESSION
   ========================================================= */

async function initialize() {

    try {

        const { data } =
            await supabaseClient.auth.getSession();

        const session =
            data.session;

        if (!session) {

            showLogin();
            return;
        }

        const userId =
            session.user.id;

        const savedPinHash =
            localStorage.getItem(
                PIN_HASH_KEY
            );

        const savedPinUser =
            localStorage.getItem(
                PIN_USER_KEY
            );

        if (
            savedPinHash &&
            savedPinUser === userId
        ) {

            showLock(session);

        } else {

            /*
             * Session دارد ولی روی این دستگاه
             * هنوز PIN ساخته نشده است.
             */

            showLogin();

            loginMessage.textContent =
                "لطفاً یک‌بار با ایمیل و رمز عبور وارد شو تا رمز دستگاه ساخته شود.";
        }

    } catch (error) {

        console.error(
            "SESSION ERROR:",
            error
        );

        showLogin();
    }
}


/* =========================================================
   AUTH STATE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        console.log(
            "Auth event:",
            event
        );

    }
);


/* =========================================================
   START
   ========================================================= */

initialize();
</script>

</body>
</html>
