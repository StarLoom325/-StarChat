
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StarChat | ورود</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 15%,rgba(124,58,237,.25),transparent 35%),
        radial-gradient(circle at 85% 85%,rgba(6,182,212,.18),transparent 35%),
        #050711;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:440px;
    background:rgba(13,17,32,.92);
    border:1px solid rgba(139,92,246,.28);
    border-radius:28px;
    padding:30px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 50px rgba(124,58,237,.08);
    backdrop-filter:blur(20px);
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:900;
    background:linear-gradient(90deg,#c4b5fd,#22d3ee);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.logoSub{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    margin-top:5px;
    margin-bottom:25px;
}

.lockIcon{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:0 auto 18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    background:rgba(124,58,237,.13);
    border:1px solid rgba(167,139,250,.25);
}

h2{
    text-align:center;
    font-size:20px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8b93a7;
    font-size:13px;
    line-height:1.8;
    margin-bottom:23px;
}

.userName{
    text-align:center;
    color:#c4b5fd;
    font-size:14px;
    margin-bottom:17px;
}

label{
    display:block;
    color:#cbd5e1;
    font-size:13px;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:14px 15px;
    border-radius:13px;
    border:1px solid #29314c;
    background:#080c18;
    color:#fff;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;
    margin-top:20px;
    color:white;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    background:linear-gradient(135deg,#7c3aed,#0891b2);
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.secondary{
    background:#151b2e;
    border:1px solid #303952;
}

.danger{
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.25);
    color:#fca5a5;
}

.link{
    text-align:center;
    margin-top:20px;
    color:#7f889c;
    font-size:13px;
}

.link a{
    color:#a78bfa;
    text-decoration:none;
    font-weight:bold;
}

.message{
    display:none;
    margin-top:16px;
    padding:12px 14px;
    border-radius:12px;
    line-height:1.8;
    font-size:13px;
}

.message.show{
    display:block;
}

.message.error{
    color:#fecaca;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.25);
}

.message.success{
    color:#bbf7d0;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.25);
}

.hidden{
    display:none!important;
}

.small{
    color:#6b7280;
    font-size:11px;
    text-align:center;
    margin-top:13px;
    line-height:1.8;
}

@media(max-width:480px){
    body{
        padding:12px;
    }

    .card{
        padding:23px;
        border-radius:22px;
    }

    .logo{
        font-size:31px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">✦ StarChat</div>

    <div class="logoSub">
        پیام‌رسان StarLoom
    </div>

    <!-- ================= LOCK VIEW ================= -->

    <section id="lockView" class="hidden">

        <div class="lockIcon">🔐</div>

        <h2>
            StarChat قفل است
        </h2>

        <div id="userName" class="userName">
            در حال بارگذاری...
        </div>

        <div class="subtitle">
            برای ورود، رمز StarChat را وارد کنید.
        </div>

        <label>
            رمز ورود
        </label>

        <input
            id="pinInput"
            type="password"
            autocomplete="off"
            inputmode="numeric"
            placeholder="رمز StarChat"
        >

        <button id="unlockButton">
            🔓 ورود
        </button>

        <button
            id="forgetDeviceButton"
            class="secondary"
        >
            ورود با حساب اصلی
        </button>

    </section>

    <!-- ================= LOGIN VIEW ================= -->

    <section id="loginView">

        <h2>
            ورود به StarChat
        </h2>

        <div class="subtitle">
            ایمیل و رمز حساب خود را وارد کنید.
        </div>

        <form id="loginForm">

            <label>
                ایمیل
            </label>

            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="example@email.com"
                required
            >

            <label>
                رمز عبور
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="رمز عبور"
                required
            >

            <button
                id="loginButton"
                type="submit"
            >
                ورود
            </button>

        </form>

        <div class="link">
            حساب نداری؟
            <a href="register.html">
                ساخت حساب
            </a>
        </div>

    </section>

    <div id="message" class="message"></div>

    <div class="small">
        StarChat توسط StarLoom
    </div>

</div>

<script>
/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
    "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );

/* =========================================================
   ELEMENTS
   ========================================================= */

const lockView =
    document.getElementById("lockView");

const loginView =
    document.getElementById("loginView");

const message =
    document.getElementById("message");

const pinInput =
    document.getElementById("pinInput");

const unlockButton =
    document.getElementById("unlockButton");

const userName =
    document.getElementById("userName");

/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text,type="error"){

    message.textContent = text;

    message.className =
        "message show " + type;
}

function clearMessage(){

    message.textContent = "";

    message.className =
        "message";
}

/* =========================================================
   HASH PIN
   ========================================================= */

async function hashText(text){

    const bytes =
        new TextEncoder().encode(text);

    const hash =
        await crypto.subtle.digest(
            "SHA-256",
            bytes
        );

    return Array
        .from(new Uint8Array(hash))
        .map(
            byte =>
                byte
                .toString(16)
                .padStart(2,"0")
        )
        .join("");
}

/* =========================================================
   PROFILE
   ========================================================= */

async function getProfile(userId){

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",userId)
        .maybeSingle();

    if(error){
        throw error;
    }

    return data;
}

/* =========================================================
   CHECK SCREEN
   ========================================================= */

async function checkScreen(){

    try{

        const {
            data:{
                session
            }
        } =
        await supabaseClient.auth.getSession();

        if(!session){

            loginView.classList.remove("hidden");
            lockView.classList.add("hidden");

            return;
        }

        const pinHash =
            localStorage.getItem(
                "starchat_pin_hash"
            );

        /*
         * اگر PIN قبلاً ساخته شده باشد،
         * صفحه قفل نمایش داده می‌شود.
         */

        if(pinHash){

            loginView.classList.add("hidden");
            lockView.classList.remove("hidden");

            try{

                const profile =
                    await getProfile(
                        session.user.id
                    );

                if(profile){

                    userName.textContent =
                        profile.display_name ||
                        profile.username ||
                        "کاربر";
                }

            }catch(error){

                userName.textContent =
                    "کاربر StarChat";
            }

            return;
        }

        /*
         * اگر Session وجود دارد اما PIN وجود ندارد،
         * مستقیماً وارد چت می‌شویم.
         */

        window.location.href =
            "chat.html";

    }catch(error){

        console.error(error);

        showMessage(
            "خطا در بررسی ورود: " +
            error.message,
            "error"
        );
    }
}

/* =========================================================
   LOGIN
   ========================================================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const button =
            document.getElementById(
                "loginButton"
            );

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        if(!email || !password){

            showMessage(
                "ایمیل و رمز عبور را وارد کنید.",
                "error"
            );

            return;
        }

        button.disabled = true;
        button.textContent =
            "در حال ورود...";

        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth
            .signInWithPassword({
                email,
                password
            });

            if(error){
                throw error;
            }

            /*
             * اولین ورود با حساب اصلی.
             * PIN دستگاه را می‌سازیم.
             */

            const existingPin =
                localStorage.getItem(
                    "starchat_pin_hash"
                );

            if(!existingPin){

                let pin =
                    prompt(
                        "برای ورودهای بعدی یک رمز StarChat انتخاب کنید:"
                    );

                if(pin === null){

                    await supabaseClient.auth.signOut();

                    showMessage(
                        "ورود لغو شد.",
                        "error"
                    );

                    return;
                }

                pin =
                    String(pin).trim();

                if(pin.length < 4){

                    await supabaseClient.auth.signOut();

                    showMessage(
                        "رمز StarChat باید حداقل ۴ کاراکتر باشد.",
                        "error"
                    );

                    return;
                }

                const pinHash =
                    await hashText(pin);

                localStorage.setItem(
                    "starchat_pin_hash",
                    pinHash
                );

                localStorage.setItem(
                    "starchat_device_user",
                    data.user.id
                );
            }

            window.location.href =
                "chat.html";

        }catch(error){

            console.error(error);

            let text =
                error.message ||
                "ورود ناموفق بود.";

            if(
                text
                .toLowerCase()
                .includes("invalid login")
            ){

                text =
                    "ایمیل یا رمز عبور اشتباه است.";
            }

            showMessage(
                text,
                "error"
            );

        }finally{

            button.disabled = false;
            button.textContent = "ورود";
        }
    }
);

/* =========================================================
   UNLOCK
   ========================================================= */

unlockButton.addEventListener(
    "click",
    async function(){

        clearMessage();

        const pin =
            pinInput.value.trim();

        if(!pin){

            showMessage(
                "رمز StarChat را وارد کنید.",
                "error"
            );

            return;
        }

        unlockButton.disabled = true;
        unlockButton.textContent =
            "در حال بررسی...";

        try{

            const hash =
                await hashText(pin);

            const savedHash =
                localStorage.getItem(
                    "starchat_pin_hash"
                );

            if(!savedHash){

                loginView.classList.remove(
                    "hidden"
                );

                lockView.classList.add(
                    "hidden"
                );

                return;
            }

            if(hash !== savedHash){

                pinInput.value = "";

                showMessage(
                    "رمز StarChat اشتباه است.",
                    "error"
                );

                return;
            }

            window.location.href =
                "chat.html";

        }finally{

            unlockButton.disabled = false;
            unlockButton.textContent =
                "🔓 ورود";
        }
    }
);

/* =========================================================
   ENTER KEY
   ========================================================= */

pinInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            unlockButton.click();
        }
    }
);

/* =========================================================
   USE MAIN ACCOUNT
   ========================================================= */

document
.getElementById("forgetDeviceButton")
.addEventListener(
    "click",
    async function(){

        const answer =
            confirm(
                "قفل این دستگاه حذف شود؟\n\nبعد از آن برای ورود باید ایمیل و رمز اصلی حساب را وارد کنید."
            );

        if(!answer){
            return;
        }

        localStorage.removeItem(
            "starchat_pin_hash"
        );

        localStorage.removeItem(
            "starchat_device_user"
        );

        await supabaseClient.auth.signOut();

        location.reload();
    }
);

/* =========================================================
   START
   ========================================================= */

checkScreen();
</script>

</body>
</html>
