# انتشار خودکار روی GitHub Pages
# config.js از روی Secrets مخزن ساخته می‌شود و هیچ‌وقت داخل کد نیست.
# راه‌اندازی: Repo > Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL       = آدرس پروژه
#   SUPABASE_ANON_KEY  = کلید anon/public
# و Repo > Settings > Pages > Source = "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folder with config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir dist
          cp index.html dist/
          cat > dist/config.js <<JS
          window.APP_CONFIG = {
            SUPABASE_URL: "${SUPABASE_URL}",
            SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}",
            BUCKET: "chat-files"
          };
          JS

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4