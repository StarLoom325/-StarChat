<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ورود — پیام‌رسان</title>
<script src="config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);
    padding:16px;
  }
  .card{
    background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .logo{
    width:72px;height:72px;margin:0 auto 16px;border-radius:22px;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:0 8px 24px rgba(99,102,241,.4);
  }
  h1{font-size:22px;text-align:center;color:#1e293b;margin-bottom:6px}
  .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
  .tabs{display:flex;gap:8px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:20px}
  .tabs button{
    flex:1;padding:10px;border:none;background:transparent;border-radius:10px;
    font-size:14px;font-weight:600;color:#64748b;cursor:pointer;transition:.2s;font-family:inherit;
  }
  .tabs button.active{background:#fff;color:#6366f1;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:#64748b;margin-bottom:6px;font-weight:600}
  .field input{
    width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:12px;
    font-size:14px;font-family:inherit;transition:.2s;background:#f8fafc;
  }
  .field input:focus{outline:none;border-color:#6366f1;background:#fff}
  .field .hint{font-size:11px;color:#94a3b8;margin-top:4px}
  .btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    margin-top:8px;transition:.2s;box-shadow:0 4px 12px rgba(99,102,241,.3);
  }
  .btn:hover:not(:disabled){transform:translateY(-1px)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;line-height:1.6;word-break:break-word}
  .msg.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;display:block}
  .msg.ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;display:block}
  .msg.info{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;display:block}
  .msg.warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a;display:block}
  .msg code{background:rgba(0,0,0,.08);padding:2px 6px;border-radius:4px;font-size:12px;direction:ltr;display:inline-block}
  .hint{text-align:center;font-size:12px;color:#94a3b8;margin-top:14px}
  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid #fff;
    border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;
    vertical-align:middle;margin-left:6px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .debug{
    background:#1e293b;color:#94a3b8;font-size:11px;padding:10px;
    border-radius:8px;margin-top:12px;font-family:monospace;direction:ltr;text-align:left;
    max-height:150px;overflow-y:auto;display:none;
  }
  .debug.show{display:block}
  .debug div{padding:2px 0}
  .debug .ok{color:#22c55e}
  .debug .fail{color:#ef4444}
</style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1 id="title">خوش آمدی</h1>
  <div class="sub" id="subtitle">برای ادامه وارد شو</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setMode('login')">ورود</button>
    <button id="tabRegister" onclick="setMode('register')">ثبت‌نام</button>
  </div>

  <div id="msg" class="msg"></div>

  <form id="form" onsubmit="submitForm(event)">
    <div class="field" id="fName" style="display:none">
      <label>نام کامل</label>
      <input name="name" placeholder="مثلاً علی رضایی">
    </div>
    <div class="field" id="fPhone" style="display:none">
      <label>شماره موبایل</label>
      <input name="phone" placeholder="09xxxxxxxxx" inputmode="numeric" maxlength="11">
      <div class="hint">۱۱ رقم، شروع با ۰۹</div>
    </div>
    <div class="field">
      <label>نام کاربری</label>
      <input name="username" placeholder="مثلاً ali_reza" style="text-align:left;direction:ltr">
      <div class="hint">حروف کوچک انگلیسی، عدد و _ (۳ تا ۲۰ کاراکتر)</div>
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input name="password" type="password" placeholder="حداقل ۶ کاراکتر">
    </div>
    <button class="btn" id="submitBtn" type="submit">ورود</button>
  </form>

  <div id="debug" class="debug"></div>

  <div class="hint">با ورود، قوانین ما را می‌پذیری</div>
</div>

<script>
let mode = 'login';
let sb = null;
let busy = false;

// ═══════════════════════════════════════════════════════
//  Debug
// ═══════════════════════════════════════════════════════
function dbg(text, ok) {
  const el = document.getElementById('debug');
  el.classList.add('show');
  const line = document.createElement('div');
  line.className = ok ? 'ok' : 'fail';
  line.textContent = (ok ? '✓ ' : '✗ ') + text;
  el.appendChild(line);
  console.log(ok ? '✓' : '✗', text);
}

// ═══════════════════════════════════════════════════════
//  بارگذاری SDK از چند CDN
// ═══════════════════════════════════════════════════════
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('نشد: ' + src));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('timeout: ' + src)), 10000);
  });
}

async function loadSDK() {
  if (window.supabase) return true;

  const cdns = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2',
    'https://esm.sh/@supabase/supabase-js@2',
  ];

  for (const url of cdns) {
    try {
      await loadScript(url);
      if (window.supabase) {
        dbg('SDK از ' + new URL(url).hostname, true);
        return true;
      }
    } catch (e) {
      dbg(e.message, false);
    }
  }
  throw new Error('همه CDN ها بلاک شدن — VPN روشن کن');
}

// ═══════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════
(async () => {
  try {
    dbg('شروع…', true);

    // ۱) config.js لود شد؟
    if (typeof window.SUPABASE_URL === 'undefined') {
      showMsg('❌ فایل <code>config.js</code> پیدا نشد یا درست لود نشد', 'err');
      dbg('config.js لود نشد', false);
      return;
    }
    dbg('config.js لود شد', true);

    // ۲) مقادیر پر شده؟
    if (!window.SUPABASE_URL || window.SUPABASE_URL.includes('YOUR_')) {
      showMsg('❌ <code>SUPABASE_URL</code> در config.js پر نشده', 'err');
      dbg('SUPABASE_URL placeholder', false);
      return;
    }
    if (!window.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY.includes('YOUR_')) {
      showMsg('❌ <code>SUPABASE_ANON_KEY</code> در config.js پر نشده', 'err');
      dbg('ANON_KEY placeholder', false);
      return;
    }
    dbg('URL: ' + window.SUPABASE_URL.slice(0, 35) + '…', true);
    dbg('KEY length: ' + window.SUPABASE_ANON_KEY.length, true);

    // ۳) SDK لود
    await loadSDK();

    // ۴) اتصال
    const { createClient } = window.supabase;
    sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'messenger-auth' }
    });
    dbg('کلاینت ساخته شد', true);

    // ۵) تست اتصال
    try {
      const r = await fetch(window.SUPABASE_URL + '/rest/v1/', {
        headers: { apikey: window.SUPABASE_ANON_KEY }
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      dbg('اتصال به Supabase OK', true);
    } catch (e) {
      dbg('اتصال به Supabase شکست: ' + e.message, false);
      showMsg(
        '⚠️ نمی‌تونم به Supabase وصل شم.<br>' +
        'احتمالاً VPN روشن نیست یا URL غلطه.<br>' +
        '<code>' + window.SUPABASE_URL + '</code>',
        'warn'
      );
      return;
    }

    // ۶) نشست قبلی
    const { data } = await sb.auth.getSession();
    if (data?.session) {
      dbg('نشست قبلی پیدا شد → chat.html', true);
      window.location.replace('chat.html');
      return;
    }

    dbg('همه چیز آماده ✅', true);
    setMode('login');

  } catch (e) {
    console.error(e);
    dbg(e.message, false);
    showMsg('❌ خطا: ' + e.message, 'err');
  }
})();

// ═══════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabRegister').classList.toggle('active', m === 'register');
  document.getElementById('fName').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('fPhone').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = m === 'login' ? 'ورود' : 'ثبت‌نام';
  document.getElementById('title').textContent = m === 'login' ? 'خوش آمدی' : 'ساخت حساب';
  document.getElementById('subtitle').textContent = m === 'login' ? 'برای ادامه وارد شو' : 'ثانیه‌ای عضو شو';
  hideMsg();
}

function showMsg(html, type = 'err') {
  const m = document.getElementById('msg');
  m.innerHTML = html;
  m.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

// ═══════════════════════════════════════════════════════
//  Submit
// ═══════════════════════════════════════════════════════
async function submitForm(e) {
  e.preventDefault();
  if (busy) return;

  hideMsg();

  // چک اتصال
  if (!sb) {
    showMsg(
      '❌ اتصال به سرور برقرار نیست.<br><br>' +
      'راه‌حل‌ها:<br>' +
      '۱. VPN روشن کن<br>' +
      '۲. <code>config.js</code> رو چک کن<br>' +
      '۳. صفحه رو دوباره باز کن (Ctrl+F5)',
      'err'
    );
    return;
  }

  const btn = document.getElementById('submitBtn');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '...<span class="spinner"></span>';
  busy = true;

  const fd = new FormData(e.target);
  const username = (fd.get('username') || '').trim().toLowerCase();
  const password = fd.get('password') || '';

  try {
    if (mode === 'login') {
      // ───── ورود ─────
      if (!username || !password) throw new Error('نام کاربری و رمز عبور لازم است');

      const email = username + '@' + (window.EMAIL_DOMAIN || 'messenger.local');
      console.log('🔐 Login:', email);

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('Login error:', error);
        const m = error.message || '';
        if (m.includes('Invalid login')) throw new Error('نام کاربری یا رمز عبور اشتباه است');
        if (m.includes('Email not confirmed')) throw new Error('ایمیل تأیید نشده — در Supabase: Authentication → Providers → Email → Confirm email را خاموش کن');
        if (m.includes('fetch')) throw new Error('خطای شبکه — VPN را چک کن');
        throw new Error(m);
      }

      showMsg('✅ ورود موفق!', 'ok');
      setTimeout(() => window.location.replace('chat.html'), 400);

    } else {
      // ───── ثبت‌نام ─────
      const name = (fd.get('name') || '').trim();
      const phone = (fd.get('phone') || '').trim();

      if (!name) throw new Error('نام را وارد کن');
      if (!/^09\d{9}$/.test(phone)) throw new Error('شماره موبایل معتبر نیست');
      if (!/^[a-z0-9_]{3,20}$/.test(username)) throw new Error('نام کاربری معتبر نیست');
      if (password.length < 6) throw new Error('رمز عبور حداقل ۶ کاراکتر');

      // چک تکراری
      const { data: exist } = await sb.from('profiles').select('id').eq('phone', phone).maybeSingle();
      if (exist) throw new Error('این شماره موبایل قبلاً ثبت شده');

      const { data: exist2 } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
      if (exist2) throw new Error('این نام کاربری قبلاً گرفته شده');

      const email = username + '@' + (window.EMAIL_DOMAIN || 'messenger.local');
      console.log('📤 SignUp:', email);

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { username, name, phone } }
      });

      if (error) {
        console.error('Signup error:', error);
        const m = error.message || '';
        if (m.includes('already')) throw new Error('این نام کاربری قبلاً ثبت شده');
        if (m.includes('Password')) throw new Error('رمز عبور ضعیف است');
        if (m.includes('rate')) throw new Error('تعداد تلاش‌ها زیاد — چند دقیقه صبر کن');
        throw new Error(m);
      }

      console.log('✅ Signup:', data);

      // اگه session نداریم → confirm email روشنه
      if (!data.session) {
        const r = await sb.auth.signInWithPassword({ email, password });
        if (r.error) {
          showMsg(
            '✅ حساب ساخته شد ولی نیاز به تأیید داره.<br><br>' +
            'در Supabase برو:<br>' +
            '<b>Authentication → Providers → Email</b><br>' +
            'و <b>Confirm email</b> رو <b>خاموش</b> کن.',
            'info'
          );
          setMode('login');
          return;
        }
      }

      // منتظر ساخت پروفایل توسط trigger
      showMsg('✅ ثبت‌نام موفق!', 'ok');
      let tries = 0;
      const t = setInterval(async () => {
        tries++;
        const uid = (await sb.auth.getUser()).data.user?.id;
        const { data: p } = await sb.from('profiles').select('id').eq('id', uid).maybeSingle();
        if (p) { clearInterval(t); setTimeout(() => window.location.replace('chat.html'), 300); }
        else if (tries > 10) {
          clearInterval(t);
          // ساخت دستی
          await sb.from('profiles').insert({ id: uid, phone, username, name });
          setTimeout(() => window.location.replace('chat.html'), 300);
        }
      }, 400);
    }

  } catch (err) {
    console.error('❌', err);
    showMsg('❌ ' + err.message, 'err');
    btn.disabled = false;
    btn.textContent = oldText;
    busy = false;
  }
}
</script>
</body>
</html>
