<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ورود — پیام‌رسان</title>
<script src="config.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);
    padding:16px;
  }
  .card{
    background:#fff;border-radius:24px;padding:32px 24px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .4s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .logo{
    width:72px;height:72px;margin:0 auto 16px;border-radius:22px;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    display:flex;align-items:center;justify-content:center;font-size:36px;
    box-shadow:0 8px 24px rgba(99,102,241,.4);
  }
  h1{font-size:22px;text-align:center;color:#1e293b;margin-bottom:6px}
  .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:24px}
  .tabs{display:flex;gap:8px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:20px}
  .tabs button{
    flex:1;padding:10px;border:none;background:transparent;border-radius:10px;
    font-size:14px;font-weight:600;color:#64748b;cursor:pointer;transition:.2s;font-family:inherit;
  }
  .tabs button.active{background:#fff;color:#6366f1;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .field{margin-bottom:14px;position:relative}
  .field label{display:block;font-size:12px;color:#64748b;margin-bottom:6px;font-weight:600}
  .field input{
    width:100%;padding:13px 14px;border:2px solid #e2e8f0;border-radius:12px;
    font-size:14px;font-family:inherit;transition:.2s;background:#f8fafc;
  }
  .field input:focus{outline:none;border-color:#6366f1;background:#fff}
  .field .hint{font-size:11px;color:#94a3b8;margin-top:4px}
  .btn{
    width:100%;padding:14px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    margin-top:8px;transition:.2s;box-shadow:0 4px 12px rgba(99,102,241,.3);
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(99,102,241,.4)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5;word-break:break-word}
  .msg.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;display:block}
  .msg.ok{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;display:block}
  .msg.info{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;display:block}
  .hint{text-align:center;font-size:12px;color:#94a3b8;margin-top:14px}
  .loading{
    display:inline-block;width:14px;height:14px;border:2px solid #fff;
    border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;
    vertical-align:middle;margin-left:6px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1 id="title">خوش آمدی</h1>
  <div class="sub" id="subtitle">برای ادامه وارد شو</div>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="setMode('login')">ورود</button>
    <button id="tabRegister" onclick="setMode('register')">ثبت‌نام</button>
  </div>

  <div id="msg" class="msg"></div>

  <form id="form" onsubmit="submitForm(event)">
    <div class="field" id="fName" style="display:none">
      <label>نام کامل</label>
      <input name="name" placeholder="مثلاً علی رضایی" autocomplete="name">
    </div>
    <div class="field" id="fPhone" style="display:none">
      <label>شماره موبایل</label>
      <input name="phone" placeholder="09xxxxxxxxx" inputmode="numeric" maxlength="11" autocomplete="tel">
      <div class="hint">۱۱ رقم، شروع با ۰۹</div>
    </div>
    <div class="field">
      <label>نام کاربری</label>
      <input name="username" placeholder="مثلاً ali_reza" autocomplete="username" style="text-align:left;direction:ltr">
      <div class="hint">فقط حروف کوچک انگلیسی، عدد و _ (۳ تا ۲۰ کاراکتر)</div>
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input name="password" type="password" placeholder="حداقل ۶ کاراکتر" autocomplete="current-password">
    </div>
    <button class="btn" id="submitBtn" type="submit">ورود</button>
  </form>

  <div class="hint">با ورود، قوانین ما را می‌پذیری</div>
</div>

<script>
let mode = 'login';
let sb = null;
let busy = false;

// ═══════════════════════════════════════════════════════
//  بارگذاری SDK
// ═══════════════════════════════════════════════════════
function loadSDK() {
  return new Promise((resolve, reject) => {
    if (window.supabase) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = resolve;
    s.onerror = () => reject(new Error('خطا در بارگذاری Supabase SDK'));
    document.head.appendChild(s);
  });
}

// ═══════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════
(async () => {
  try {
    await loadSDK();

    // چک کن config درست پره
    if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY ||
        window.SUPABASE_URL.includes('YOUR_') ||
        window.SUPABASE_ANON_KEY.includes('YOUR_')) {
      showMsg('⚠️ لطفاً فایل config.js را با کلیدهای واقعی Supabase پر کن', 'err');
      return;
    }

    const { createClient } = window.supabase;
    sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'messenger-auth' }
    });

    // اگه قبلاً وارد شده بود، برو به chat
    const { data } = await sb.auth.getSession();
    if (data?.session) {
      window.location.replace('chat.html');
      return;
    }

    // پیش‌فرض روی ورود
    setMode('login');
  } catch (e) {
    console.error('Init error:', e);
    showMsg('خطا در اتصال: ' + e.message, 'err');
  }
})();

// ═══════════════════════════════════════════════════════
//  UI Helpers
// ═══════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabRegister').classList.toggle('active', m === 'register');
  document.getElementById('fName').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('fPhone').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = m === 'login' ? 'ورود' : 'ثبت‌نام';
  document.getElementById('title').textContent = m === 'login' ? 'خوش آمدی' : 'ساخت حساب';
  document.getElementById('subtitle').textContent = m === 'login' ? 'برای ادامه وارد شو' : 'ثانیه‌ای عضو شو';
  hideMsg();
}

function showMsg(text, type = 'err') {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
  console.log('[MSG]', type, text);
}

function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

// ═══════════════════════════════════════════════════════
//  Submit
// ═══════════════════════════════════════════════════════
async function submitForm(e) {
  e.preventDefault();
  if (busy) return;

  hideMsg();
  const btn = document.getElementById('submitBtn');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.innerHTML = '...<span class="loading"></span>';
  busy = true;

  const fd = new FormData(e.target);
  const username = (fd.get('username') || '').trim().toLowerCase();
  const password = fd.get('password') || '';

  try {
    if (!sb) throw new Error('اتصال به سرور برقرار نیست');

    if (mode === 'login') {
      // ───── ورود ─────
      if (!username || !password) throw new Error('نام کاربری و رمز عبور لازم است');

      const email = username + '@' + (window.EMAIL_DOMAIN || 'messenger.local');
      console.log('🔐 Login:', email);

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('Login error:', error);
        if (error.message.includes('Invalid login')) {
          throw new Error('نام کاربری یا رمز عبور اشتباه است');
        }
        if (error.message.includes('Email not confirmed')) {
          throw new Error('ایمیل تأیید نشده — در Supabase برو به Authentication → Providers → Email و Confirm email را خاموش کن');
        }
        throw new Error(error.message);
      }

      console.log('✅ Login successful:', data.user.id);
      showMsg('ورود موفق! در حال انتقال…', 'ok');
      setTimeout(() => window.location.replace('chat.html'), 400);

    } else {
      // ───── ثبت‌نام ─────
      const name = (fd.get('name') || '').trim();
      const phone = (fd.get('phone') || '').trim();

      console.log('📝 Register:', { name, phone, username });

      // اعتبارسنجی
      if (!name) throw new Error('نام را وارد کن');
      if (name.length < 2) throw new Error('نام حداقل ۲ کاراکتر باشد');

      if (!phone) throw new Error('شماره موبایل را وارد کن');
      if (!/^09\d{9}$/.test(phone)) throw new Error('شماره موبایل معتبر نیست (مثال: 09123456789)');

      if (!username) throw new Error('نام کاربری را وارد کن');
      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        throw new Error('نام کاربری: فقط حروف کوچک انگلیسی (a-z)، عدد (0-9) و _ (۳ تا ۲۰ کاراکتر)');
      }

      if (!password) throw new Error('رمز عبور را وارد کن');
      if (password.length < 6) throw new Error('رمز عبور حداقل ۶ کاراکتر باشد');

      // چک تکراری بودن شماره موبایل
      console.log('🔍 Checking phone uniqueness…');
      const { data: existPhone, error: e1 } = await sb.from('profiles')
        .select('id').eq('phone', phone).maybeSingle();

      if (e1) {
        console.warn('Phone check error:', e1);
      }
      if (existPhone) {
        throw new Error('این شماره موبایل قبلاً ثبت‌نام کرده');
      }

      // چک تکراری بودن username
      const { data: existUser, error: e2 } = await sb.from('profiles')
        .select('id').eq('username', username).maybeSingle();

      if (e2) {
        console.warn('Username check error:', e2);
      }
      if (existUser) {
        throw new Error('این نام کاربری قبلاً گرفته شده');
      }

      // ثبت‌نام
      const email = username + '@' + (window.EMAIL_DOMAIN || 'messenger.local');
      console.log('📤 signUp:', email);

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { username, name, phone },
          emailRedirectTo: undefined
        }
      });

      if (error) {
        console.error('Signup error:', error);
        if (error.message.includes('already registered') || error.message.includes('already exists')) {
          throw new Error('این نام کاربری قبلاً ثبت شده');
        }
        if (error.message.includes('Password should be')) {
          throw new Error('رمز عبور ضعیف است');
        }
        if (error.message.includes('rate limit')) {
          throw new Error('تعداد تلاش‌ها زیاد بود، چند دقیقه بعد امتحان کن');
        }
        throw new Error(error.message);
      }

      console.log('✅ Signup success:', data);

      // چک کن آیا session ساخته شده یا نیاز به confirm email هست
      if (!data.session) {
        // یعنی Confirm email روشنه — کاربر باید تأیید کنه
        console.warn('No session returned — email confirmation may be ON');

        // تلاش برای ورود خودکار
        const loginRes = await sb.auth.signInWithPassword({ email, password });

        if (loginRes.error) {
          showMsg(
            '✅ حساب ساخته شد ولی نیاز به تأیید دارد.\n' +
            'در Supabase برو: Authentication → Providers → Email → Confirm email را خاموش کن',
            'info'
          );
          setMode('login');
          btn.disabled = false;
          btn.textContent = oldText;
          busy = false;
          return;
        }

        // ورود موفق
        showMsg('✅ ثبت‌نام و ورود موفق!', 'ok');
        setTimeout(() => window.location.replace('chat.html'), 400);
        return;
      }

      // اگه session داریم، یعنی همه چیز OK
      showMsg('✅ ثبت‌نام موفق! در حال انتقال…', 'ok');

      // صبر کن تا trigger پروفایل رو بسازه
      let tries = 0;
      const checkProfile = setInterval(async () => {
        tries++;
        const { data: prof } = await sb.from('profiles')
          .select('id').eq('id', data.user.id).maybeSingle();

        if (prof) {
          clearInterval(checkProfile);
          console.log('✅ Profile created');
          setTimeout(() => window.location.replace('chat.html'), 300);
        } else if (tries > 10) {
          clearInterval(checkProfile);
          console.warn('⚠️ Profile not created after 5s');
          // اگه پروفایل ساخته نشد، خودمون بسازیم
          await sb.from('profiles').insert({
            id: data.user.id,
            phone, username, name
          });
          setTimeout(() => window.location.replace('chat.html'), 300);
        }
      }, 500);

    }

  } catch (err) {
    console.error('❌ Error:', err);
    showMsg(err.message || 'خطای ناشناخته', 'err');
  } finally {
    // فقط اگه موفق نشده بودیم، دکمه رو برگردون
    setTimeout(() => {
      if (!document.hidden && btn.disabled) {
        btn.disabled = false;
        btn.textContent = oldText;
        busy = false;
      }
    }, 5000);
  }
}

// ═══════════════════════════════════════════════════════
//  Debug helper — در Console استفاده کن
// ═══════════════════════════════════════════════════════
window.debugCheck = async () => {
  console.log('SUPABASE_URL:', window.SUPABASE_URL);
  console.log('ANON_KEY length:', window.SUPABASE_ANON_KEY?.length);

  try {
    const r = await fetch(window.SUPABASE_URL + '/rest/v1/', {
      headers: { apikey: window.SUPABASE_ANON_KEY }
    });
    console.log('REST status:', r.status);
    console.log('REST body:', await r.text());
  } catch (e) {
    console.error('Fetch failed:', e);
  }
};
</script>
</body>
</html>
