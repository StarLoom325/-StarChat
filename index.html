<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | StarChat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #060913;
            --panel: rgba(14, 18, 35, 0.88);
            --panel2: rgba(20, 25, 47, 0.78);
            --border: rgba(255, 255, 255, 0.09);
            --text: #ffffff;
            --muted: #9aa3bd;
            --purple: #8668ff;
            --cyan: #31d9ff;
            --danger: #ff5f7a;
            --success: #43e7a6;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            top: -180px;
            left: -120px;
            background: #6d4cff;
        }

        body::after {
            bottom: -180px;
            right: -120px;
            background: #00cfff;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.35;
            background-image:
                radial-gradient(circle at 10% 20%, white 1px, transparent 1.5px),
                radial-gradient(circle at 80% 15%, white 1px, transparent 1.5px),
                radial-gradient(circle at 30% 75%, white 1px, transparent 1.5px),
                radial-gradient(circle at 90% 80%, white 1px, transparent 1.5px),
                radial-gradient(circle at 60% 55%, white 1px, transparent 1.5px);
            background-size: 220px 220px, 280px 280px, 340px 340px, 260px 260px, 300px 300px;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: linear-gradient(
                180deg,
                rgba(20, 25, 48, 0.9),
                rgba(8, 11, 24, 0.94)
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background:
                linear-gradient(135deg, var(--purple), var(--cyan));
            box-shadow:
                0 0 30px rgba(105, 89, 255, 0.35);
            font-size: 34px;
            font-weight: 900;
        }

        .brand h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .brand p {
            color: var(--muted);
            font-size: 14px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #dbe1f5;
            font-size: 13px;
        }

        .input-wrap {
            position: relative;
        }

        .input {
            width: 100%;
            height: 52px;
            border: 1px solid rgba(255,255,255,0.08);
            outline: none;
            border-radius: 15px;
            padding: 0 15px;
            background: rgba(255,255,255,0.045);
            color: white;
            font-size: 14px;
            transition: 0.2s;
        }

        .input:focus {
            border-color: rgba(134,104,255,0.65);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(134,104,255,0.08);
        }

        .password-input {
            padding-left: 50px;
        }

        .toggle {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #a7b0c8;
            cursor: pointer;
            font-size: 16px;
        }

        .hint {
            margin-top: 6px;
            color: #7e89a3;
            font-size: 11px;
        }

        .status {
            min-height: 18px;
            margin-top: 5px;
            font-size: 11px;
        }

        .status.ok {
            color: var(--success);
        }

        .status.error {
            color: var(--danger);
        }

        .strength {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .bar {
            flex: 1;
            height: 4px;
            border-radius: 100px;
            background: rgba(255,255,255,0.08);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 18px 0;
            color: #aeb6ca;
            font-size: 12px;
            line-height: 1.7;
        }

        .terms input {
            margin-top: 3px;
            accent-color: var(--purple);
        }

        .submit {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: 700;
            background:
                linear-gradient(135deg, var(--purple), #557fff);
            box-shadow:
                0 12px 30px rgba(108, 80, 255, 0.22);
            transition: 0.2s;
        }

        .submit:hover {
            transform: translateY(-1px);
        }

        .submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .bottom {
            text-align: center;
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
        }

        .bottom a {
            color: #b19eff;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            left: 20px;
            bottom: 20px;
            max-width: min(390px, calc(100vw - 40px));
            padding: 13px 15px;
            border-radius: 14px;
            background: rgba(16, 21, 39, 0.96);
            border: 1px solid var(--border);
            color: white;
            font-size: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: 0.25s;
            z-index: 20;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            border-color: rgba(255,95,122,0.35);
        }

        .toast.success {
            border-color: rgba(67,231,166,0.35);
        }

        @media (max-width: 520px) {
            .card {
                padding: 22px;
                border-radius: 22px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="stars"></div>

<main class="page">
    <section class="card">

        <div class="brand">
            <div class="logo">✦</div>
            <h1>StarChat</h1>
            <p>پیام‌رسان StarLoom</p>
        </div>

        <form id="registerForm">

            <div class="field">
                <label for="displayName">نام نمایشی</label>
                <input
                    id="displayName"
                    class="input"
                    type="text"
                    maxlength="40"
                    autocomplete="name"
                    placeholder="مثلاً حسن"
                    required
                >
            </div>

            <div class="field">
                <label for="username">نام کاربری</label>

                <input
                    id="username"
                    class="input"
                    type="text"
                    maxlength="24"
                    autocomplete="username"
                    placeholder="مثلاً hasan_123"
                    required
                >

                <div class="hint">
                    فقط حروف انگلیسی، عدد، _ و -
                </div>

                <div id="usernameStatus" class="status"></div>
            </div>

            <div class="field">
                <label for="email">ایمیل</label>

                <input
                    id="email"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="field">
                <label for="password">رمز عبور</label>

                <div class="input-wrap">
                    <input
                        id="password"
                        class="input password-input"
                        type="password"
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="حداقل ۶ کاراکتر"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        data-target="password"
                    >◉</button>
                </div>

                <div class="strength">
                    <div class="bar" id="bar1"></div>
                    <div class="bar" id="bar2"></div>
                    <div class="bar" id="bar3"></div>
                    <div class="bar" id="bar4"></div>
                </div>
            </div>

            <div class="field">
                <label for="confirmPassword">تکرار رمز عبور</label>

                <div class="input-wrap">
                    <input
                        id="confirmPassword"
                        class="input password-input"
                        type="password"
                        autocomplete="new-password"
                        placeholder="رمز را دوباره وارد کنید"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        data-target="confirmPassword"
                    >◉</button>
                </div>

                <div id="passwordStatus" class="status"></div>
            </div>

            <label class="terms">
                <input id="terms" type="checkbox" required>

                <span>
                    با ساخت حساب، قوانین استفاده از StarChat را می‌پذیرم.
                </span>
            </label>

            <button
                id="submitBtn"
                class="submit"
                type="submit"
            >
                ساخت حساب
            </button>

        </form>

        <div class="bottom">
            قبلاً حساب ساخته‌ای؟
            <a href="./register.html">ورود</a>
        </div>

    </section>
</main>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL = "https://txstexjrypiowndavrtr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6WqGjT0eriWi9JcJWRsVvg_J358WuUz";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const form = document.getElementById("registerForm");
const displayNameInput = document.getElementById("displayName");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const usernameStatus = document.getElementById("usernameStatus");
const passwordStatus = document.getElementById("passwordStatus");
const submitBtn = document.getElementById("submitBtn");
const toast = document.getElementById("toast");

const bars = [
    document.getElementById("bar1"),
    document.getElementById("bar2"),
    document.getElementById("bar3"),
    document.getElementById("bar4")
];

let usernameCheckTimer = null;
let usernameAvailable = false;


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function showToast(message, type = "error") {
    clearTimeout(toastTimer);

    toast.textContent = message;
    toast.className = "toast show " + type;

    toastTimer = setTimeout(() => {
        toast.className = "toast";
    }, 4000);
}


/* =========================================================
   PASSWORD VISIBILITY
   ========================================================= */

document.querySelectorAll(".toggle").forEach(button => {

    button.addEventListener("click", () => {

        const input = document.getElementById(button.dataset.target);

        if (!input) return;

        input.type = input.type === "password"
            ? "text"
            : "password";
    });

});


/* =========================================================
   USERNAME NORMALIZATION
   ========================================================= */

usernameInput.addEventListener("input", () => {

    let value = usernameInput.value
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "");

    usernameInput.value = value;

    usernameAvailable = false;

    clearTimeout(usernameCheckTimer);

    if (value.length < 3) {
        usernameStatus.textContent = "";
        usernameStatus.className = "status";
        return;
    }

    usernameStatus.textContent = "در حال بررسی...";
    usernameStatus.className = "status";

    usernameCheckTimer = setTimeout(
        checkUsername,
        450
    );
});


/* =========================================================
   CHECK USERNAME
   ========================================================= */

async function checkUsername() {

    const username = usernameInput.value.trim();

    if (username.length < 3) return;

    try {

        const { data, error } = await supabaseClient
            .from("profiles")
            .select("id")
            .eq("username", username)
            .limit(1);

        if (error) {
            console.error("Username check:", error);

            usernameStatus.textContent =
                "بررسی نام کاربری انجام نشد";

            usernameStatus.className =
                "status error";

            usernameAvailable = false;

            return;
        }

        if (data && data.length > 0) {

            usernameAvailable = false;

            usernameStatus.textContent =
                "این نام کاربری قبلاً استفاده شده است";

            usernameStatus.className =
                "status error";

        } else {

            usernameAvailable = true;

            usernameStatus.textContent =
                "نام کاربری آزاد است ✓";

            usernameStatus.className =
                "status ok";
        }

    } catch (error) {

        console.error(error);

        usernameAvailable = false;

        usernameStatus.textContent =
            "خطا در بررسی نام کاربری";

        usernameStatus.className =
            "status error";
    }
}


/* =========================================================
   PASSWORD STRENGTH
   ========================================================= */

passwordInput.addEventListener("input", updatePasswordStrength);

function updatePasswordStrength() {

    const value = passwordInput.value;

    let score = 0;

    if (value.length >= 6) score++;
    if (value.length >= 10) score++;
    if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
    if (/\d/.test(value) || /[^A-Za-z0-9]/.test(value)) score++;

    bars.forEach((bar, index) => {
        bar.style.background =
            index < score
                ? "linear-gradient(90deg,#8668ff,#31d9ff)"
                : "rgba(255,255,255,0.08)";
    });
}


/* =========================================================
   PASSWORD MATCH
   ========================================================= */

confirmPasswordInput.addEventListener(
    "input",
    checkPasswordMatch
);

passwordInput.addEventListener(
    "input",
    checkPasswordMatch
);

function checkPasswordMatch() {

    if (!confirmPasswordInput.value) {
        passwordStatus.textContent = "";
        passwordStatus.className = "status";
        return;
    }

    if (passwordInput.value !== confirmPasswordInput.value) {

        passwordStatus.textContent =
            "رمزهای عبور یکسان نیستند";

        passwordStatus.className =
            "status error";

    } else {

        passwordStatus.textContent =
            "رمزها یکسان هستند ✓";

        passwordStatus.className =
            "status ok";
    }
}


/* =========================================================
   SUBMIT
   ========================================================= */

form.addEventListener("submit", async event => {

    event.preventDefault();

    const displayName =
        displayNameInput.value.trim();

    const username =
        usernameInput.value.trim()
            .toLowerCase();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;

    const terms =
        document.getElementById("terms").checked;


    if (displayName.length < 2) {
        showToast("نام نمایشی را کامل وارد کن.");
        return;
    }

    if (!/^[a-z0-9_-]{3,24}$/.test(username)) {
        showToast(
            "نام کاربری باید ۳ تا ۲۴ کاراکتر باشد."
        );
        return;
    }

    if (password.length < 6) {
        showToast(
            "رمز عبور باید حداقل ۶ کاراکتر باشد."
        );
        return;
    }

    if (password !== confirmPassword) {
        showToast(
            "رمزهای عبور یکسان نیستند."
        );
        return;
    }

    if (!terms) {
        showToast(
            "لطفاً قوانین استفاده را تأیید کن."
        );
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "در حال ساخت حساب...";

    try {

        /* آخرین بررسی username */

        const { data: existingUsername, error: usernameError } =
            await supabaseClient
                .from("profiles")
                .select("id")
                .eq("username", username)
                .limit(1);

        if (usernameError) {
            throw usernameError;
        }

        if (existingUsername && existingUsername.length > 0) {

            usernameStatus.textContent =
                "این نام کاربری قبلاً استفاده شده است";

            usernameStatus.className =
                "status error";

            showToast("نام کاربری دیگری انتخاب کن.");

            return;
        }


        /* ایجاد حساب */

        const { data, error } =
            await supabaseClient.auth.signUp({

                email,
                password,

                options: {
                    data: {
                        display_name: displayName,
                        username: username
                    }
                }
            });

        if (error) {
            throw error;
        }


        /* اگر session ساخته شد */
        if (data.session) {

            /*
             * در بعضی تنظیمات trigger پروفایل را می‌سازد.
             * این fallback فقط در صورتی اجرا می‌شود که
             * پروفایل موجود نباشد.
             */

            const userId = data.user.id;

            const { data: existingProfile } =
                await supabaseClient
                    .from("profiles")
                    .select("id")
                    .eq("id", userId)
                    .maybeSingle();

            if (!existingProfile) {

                const { error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .insert({
                            id: userId,
                            display_name: displayName,
                            username: username,
                            avatar: "",
                            bio: ""
                        });

                if (profileError) {
                    console.warn(
                        "Fallback profile insert failed:",
                        profileError
                    );
                }
            }

            showToast(
                "حساب ساخته شد. در حال ورود...",
                "success"
            );

            setTimeout(() => {
                window.location.href = "./register.html";
            }, 800);

            return;
        }


        /*
         * اگر Confirm Email در Supabase فعال باشد،
         * session ساخته نمی‌شود.
         */

        showToast(
            "حساب ساخته شد. اگر وارد نشدی، Confirm email را در Supabase خاموش کن.",
            "success"
        );

        setTimeout(() => {
            window.location.href = "./register.html";
        }, 1600);

    } catch (error) {

        console.error("SIGNUP ERROR:", error);

        let message =
            error?.message ||
            "ثبت‌نام انجام نشد.";

        if (
            message.toLowerCase().includes("already registered")
        ) {
            message =
                "این ایمیل قبلاً ثبت شده است.";
        }

        if (
            message.toLowerCase().includes("duplicate")
        ) {
            message =
                "این نام کاربری قبلاً استفاده شده است.";
        }

        if (
            message.toLowerCase().includes("database error")
        ) {
            message =
                "خطای پایگاه داده رخ داد. تنظیمات profiles و trigger را بررسی کن.";
        }

        showToast(message);

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "ساخت حساب";
    }

});


/* =========================================================
   SESSION CHECK
   ========================================================= */

(async function sessionCheck() {

    try {

        const { data } =
            await supabaseClient.auth.getSession();

        /*
         * اگر قبلاً session وجود داشت،
         * ثبت‌نام اجباری نیست.
         * کاربر می‌تواند از لینک ورود وارد شود.
         */

        if (data.session) {
            console.log(
                "Existing session:",
                data.session.user.id
            );
        }

    } catch (error) {
        console.error(
            "Session check error:",
            error
        );
    }

})();
</script>

</body>
</html>
