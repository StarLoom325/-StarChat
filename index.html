
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>StarChat | ثبت‌نام</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #060913;
            --panel: rgba(15, 20, 38, 0.92);
            --panel-light: rgba(255,255,255,0.045);
            --border: rgba(255,255,255,0.09);
            --text: #ffffff;
            --muted: #9aa5c0;
            --purple: #8668ff;
            --purple-2: #6e57ff;
            --cyan: #31d9ff;
            --green: #43e7a6;
            --red: #ff5d78;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(118, 82, 255, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(26, 207, 255, 0.12),
                    transparent 30%
                ),
                var(--bg);
            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255,255,255,.7) 1px, transparent 1.5px),
                radial-gradient(circle at 80% 15%, rgba(255,255,255,.5) 1px, transparent 1.5px),
                radial-gradient(circle at 33% 72%, rgba(255,255,255,.6) 1px, transparent 1.5px),
                radial-gradient(circle at 90% 60%, rgba(255,255,255,.45) 1px, transparent 1.5px),
                radial-gradient(circle at 58% 45%, rgba(255,255,255,.45) 1px, transparent 1.5px);
            background-size:
                220px 220px,
                290px 290px,
                350px 350px,
                270px 270px,
                320px 320px;
            opacity: .28;
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .card {
            width: 100%;
            max-width: 470px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background:
                linear-gradient(
                    180deg,
                    rgba(23, 29, 53, .95),
                    rgba(8, 12, 25, .96)
                );
            box-shadow:
                0 30px 90px rgba(0,0,0,.48),
                inset 0 1px 0 rgba(255,255,255,.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 37px;
            font-weight: 900;
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--cyan)
                );
            box-shadow:
                0 0 36px rgba(110,87,255,.32);
        }

        .brand h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .brand p {
            font-size: 14px;
            color: var(--muted);
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #dce2f3;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input {
            width: 100%;
            height: 53px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            outline: none;
            color: #fff;
            background: rgba(255,255,255,.045);
            padding: 0 15px;
            font-family: inherit;
            font-size: 14px;
            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }

        .input:focus {
            border-color: rgba(134,104,255,.7);
            background: rgba(255,255,255,.06);
            box-shadow:
                0 0 0 4px rgba(134,104,255,.08);
        }

        .password-input {
            padding-left: 52px;
        }

        .toggle {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #aeb6ce;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }

        .hint {
            color: #74809b;
            margin-top: 6px;
            font-size: 11px;
        }

        .status {
            min-height: 18px;
            margin-top: 6px;
            font-size: 11px;
        }

        .status.ok {
            color: var(--green);
        }

        .status.error {
            color: var(--red);
        }

        .strength {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .bar {
            flex: 1;
            height: 4px;
            border-radius: 999px;
            background: rgba(255,255,255,.08);
            transition: .2s ease;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 18px 0;
            color: #9fa9c1;
            line-height: 1.8;
            font-size: 12px;
        }

        .terms input {
            margin-top: 4px;
            accent-color: var(--purple);
        }

        .submit {
            width: 100%;
            height: 55px;
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    #587cff
                );
            box-shadow:
                0 13px 30px rgba(95,78,255,.24);
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            transition: transform .2s ease, opacity .2s ease;
        }

        .submit:hover {
            transform: translateY(-1px);
        }

        .submit:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .bottom {
            text-align: center;
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
        }

        .bottom a {
            color: #b5a5ff;
            text-decoration: none;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        .message {
            min-height: 20px;
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            line-height: 1.7;
        }

        .message.error {
            color: var(--red);
        }

        .message.success {
            color: var(--green);
        }

        .toast {
            position: fixed;
            left: 18px;
            bottom: 18px;
            z-index: 100;
            width: min(400px, calc(100vw - 36px));
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(14,18,34,.97);
            color: #fff;
            font-size: 12px;
            box-shadow: 0 20px 55px rgba(0,0,0,.38);
            opacity: 0;
            transform: translateY(14px);
            pointer-events: none;
            transition: .25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            border-color: rgba(255,93,120,.28);
        }

        .toast.success {
            border-color: rgba(67,231,166,.28);
        }

        @media (max-width: 520px) {
            .page {
                padding: 18px 12px;
            }

            .card {
                padding: 22px;
                border-radius: 23px;
            }

            .brand h1 {
                font-size: 26px;
            }

            .logo {
                width: 72px;
                height: 72px;
                border-radius: 22px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <section class="card">

        <div class="brand">
            <div class="logo">✦</div>

            <h1>StarChat</h1>

            <p>
                ساخت حساب در پیام‌رسان StarLoom
            </p>
        </div>

        <form id="registerForm">

            <div class="field">
                <label for="displayName">
                    نام نمایشی
                </label>

                <input
                    id="displayName"
                    class="input"
                    type="text"
                    maxlength="40"
                    autocomplete="name"
                    placeholder="مثلاً حسن"
                    required
                >
            </div>

            <div class="field">
                <label for="username">
                    نام کاربری
                </label>

                <input
                    id="username"
                    class="input"
                    type="text"
                    maxlength="24"
                    autocomplete="username"
                    placeholder="مثلاً hasan_123"
                    required
                >

                <div class="hint">
                    فقط a-z، عدد، _ و -
                </div>

                <div
                    id="usernameStatus"
                    class="status"
                ></div>
            </div>

            <div class="field">
                <label for="email">
                    ایمیل
                </label>

                <input
                    id="email"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="field">

                <label for="password">
                    رمز عبور
                </label>

                <div class="input-wrap">

                    <input
                        id="password"
                        class="input password-input"
                        type="password"
                        minlength="6"
                        autocomplete="new-password"
                        placeholder="حداقل ۶ کاراکتر"
                        required
                    >

                    <button
                        class="toggle"
                        type="button"
                        id="togglePassword"
                    >◉</button>

                </div>

                <div class="strength">
                    <div class="bar" id="bar1"></div>
                    <div class="bar" id="bar2"></div>
                    <div class="bar" id="bar3"></div>
                    <div class="bar" id="bar4"></div>
                </div>
            </div>

            <div class="field">

                <label for="confirmPassword">
                    تکرار رمز عبور
                </label>

                <div class="input-wrap">

                    <input
                        id="confirmPassword"
                        class="input password-input"
                        type="password"
                        autocomplete="new-password"
                        placeholder="رمز را دوباره وارد کنید"
                        required
                    >

                    <button
                        class="toggle"
                        type="button"
                        id="toggleConfirm"
                    >◉</button>

                </div>

                <div
                    id="passwordStatus"
                    class="status"
                ></div>
            </div>

            <label class="terms">

                <input
                    id="terms"
                    type="checkbox"
                    required
                >

                <span>
                    با ساخت حساب، قوانین استفاده از StarChat را می‌پذیرم.
                </span>

            </label>

            <button
                id="submitBtn"
                class="submit"
                type="submit"
            >
                ساخت حساب
            </button>

            <div
                id="formMessage"
                class="message"
            ></div>

        </form>

        <div class="bottom">
            قبلاً حساب داری؟
            <a href="./register.html">
                ورود به حساب
            </a>
        </div>

    </section>

</div>

<div
    id="toast"
    class="toast"
></div>


<script>
/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
    "https://txstexjrypiowndavrtr.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_6WqGjT0eriWi9JcJWRsVvg_J358WuUz";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================================================
   ELEMENTS
   ========================================================= */

const registerForm =
    document.getElementById("registerForm");

const displayNameInput =
    document.getElementById("displayName");

const usernameInput =
    document.getElementById("username");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const usernameStatus =
    document.getElementById("usernameStatus");

const passwordStatus =
    document.getElementById("passwordStatus");

const formMessage =
    document.getElementById("formMessage");

const submitBtn =
    document.getElementById("submitBtn");

const toast =
    document.getElementById("toast");


const bars = [
    document.getElementById("bar1"),
    document.getElementById("bar2"),
    document.getElementById("bar3"),
    document.getElementById("bar4")
];


let usernameTimer = null;


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;

function showToast(
    message,
    type = "error"
) {
    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.className =
        "toast show " + type;

    toastTimer =
        setTimeout(() => {
            toast.className = "toast";
        }, 4000);
}


/* =========================================================
   PASSWORD VISIBILITY
   ========================================================= */

document
    .getElementById("togglePassword")
    .addEventListener(
        "click",
        () => {

            passwordInput.type =
                passwordInput.type === "password"
                    ? "text"
                    : "password";
        }
    );


document
    .getElementById("toggleConfirm")
    .addEventListener(
        "click",
        () => {

            confirmPasswordInput.type =
                confirmPasswordInput.type === "password"
                    ? "text"
                    : "password";
        }
    );


/* =========================================================
   USERNAME
   ========================================================= */

usernameInput.addEventListener(
    "input",
    () => {

        usernameInput.value =
            usernameInput.value
                .toLowerCase()
                .replace(/[^a-z0-9_-]/g, "");

        usernameStatus.textContent = "";

        clearTimeout(usernameTimer);

        if (
            usernameInput.value.length < 3
        ) {
            return;
        }

        usernameStatus.textContent =
            "در حال بررسی...";

        usernameTimer =
            setTimeout(
                checkUsername,
                500
            );
    }
);


async function checkUsername() {

    const username =
        usernameInput.value.trim();

    if (username.length < 3) {
        return;
    }

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select("id")
                .eq("username", username)
                .limit(1);

        if (error) {
            throw error;
        }

        if (
            Array.isArray(data) &&
            data.length > 0
        ) {

            usernameStatus.textContent =
                "این نام کاربری قبلاً استفاده شده است.";

            usernameStatus.className =
                "status error";

        } else {

            usernameStatus.textContent =
                "این نام کاربری آزاد است ✓";

            usernameStatus.className =
                "status ok";
        }

    } catch (error) {

        console.error(
            "USERNAME CHECK:",
            error
        );

        usernameStatus.textContent =
            "بررسی نام کاربری ناموفق بود.";

        usernameStatus.className =
            "status error";
    }
}


/* =========================================================
   PASSWORD STRENGTH
   ========================================================= */

passwordInput.addEventListener(
    "input",
    updatePasswordStrength
);


function updatePasswordStrength() {

    const value =
        passwordInput.value;

    let score = 0;

    if (value.length >= 6) {
        score++;
    }

    if (value.length >= 10) {
        score++;
    }

    if (
        /[a-z]/.test(value) &&
        /[A-Z]/.test(value)
    ) {
        score++;
    }

    if (
        /\d/.test(value) ||
        /[^A-Za-z0-9]/.test(value)
    ) {
        score++;
    }

    bars.forEach(
        (bar, index) => {

            if (index < score) {

                bar.style.background =
                    "linear-gradient(90deg,#8668ff,#31d9ff)";

            } else {

                bar.style.background =
                    "rgba(255,255,255,.08)";
            }
        }
    );
}


/* =========================================================
   PASSWORD MATCH
   ========================================================= */

passwordInput.addEventListener(
    "input",
    checkPasswordMatch
);

confirmPasswordInput.addEventListener(
    "input",
    checkPasswordMatch
);


function checkPasswordMatch() {

    if (
        !confirmPasswordInput.value
    ) {

        passwordStatus.textContent = "";
        passwordStatus.className = "status";

        return;
    }

    if (
        passwordInput.value !==
        confirmPasswordInput.value
    ) {

        passwordStatus.textContent =
            "رمزها یکسان نیستند.";

        passwordStatus.className =
            "status error";

    } else {

        passwordStatus.textContent =
            "رمزها یکسان هستند ✓";

        passwordStatus.className =
            "status ok";
    }
}


/* =========================================================
   REGISTER
   ========================================================= */

registerForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        formMessage.textContent = "";
        formMessage.className =
            "message";

        const displayName =
            displayNameInput.value.trim();

        const username =
            usernameInput.value
                .trim()
                .toLowerCase();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;

        const terms =
            document.getElementById("terms").checked;


        /* VALIDATION */

        if (displayName.length < 2) {

            showToast(
                "نام نمایشی را کامل وارد کن."
            );

            return;
        }


        if (
            !/^[a-z0-9_-]{3,24}$/
                .test(username)
        ) {

            showToast(
                "نام کاربری باید ۳ تا ۲۴ کاراکتر باشد."
            );

            return;
        }


        if (password.length < 6) {

            showToast(
                "رمز عبور باید حداقل ۶ کاراکتر باشد."
            );

            return;
        }


        if (
            password !== confirmPassword
        ) {

            showToast(
                "رمزهای عبور یکسان نیستند."
            );

            return;
        }


        if (!terms) {

            showToast(
                "لطفاً قوانین استفاده را تأیید کن."
            );

            return;
        }


        submitBtn.disabled = true;
        submitBtn.textContent =
            "در حال ساخت حساب...";


        try {

            /* آخرین بررسی username */

            const {
                data: existing,
                error: existingError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("id")
                    .eq("username", username)
                    .limit(1);

            if (existingError) {
                throw existingError;
            }

            if (
                existing &&
                existing.length > 0
            ) {

                usernameStatus.textContent =
                    "این نام کاربری قبلاً استفاده شده است.";

                usernameStatus.className =
                    "status error";

                return;
            }


            /* CREATE ACCOUNT */

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email,
                    password,

                    options: {
                        data: {
                            display_name:
                                displayName,

                            username:
                                username
                        }
                    }
                });


            if (error) {
                throw error;
            }


            /* SESSION CREATED */

            if (data.session) {

                formMessage.textContent =
                    "حساب با موفقیت ساخته شد.";

                formMessage.className =
                    "message success";


                /*
                 * در صورت وجود Session،
                 * کاربر مستقیم به صفحه ورود می‌رود.
                 */

                setTimeout(
                    () => {
                        window.location.href =
                            "./register.html";
                    },
                    900
                );

                return;
            }


            /*
             * اگر Confirm Email فعال باشد،
             * Supabase session ایجاد نمی‌کند.
             */

            formMessage.textContent =
                "حساب ساخته شد. برای ورود، تنظیم Confirm Email را در Supabase بررسی کن.";

            formMessage.className =
                "message success";


            setTimeout(
                () => {
                    window.location.href =
                        "./register.html";
                },
                1800
            );


        } catch (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );

            let message =
                error?.message ||
                "ثبت‌نام انجام نشد.";


            const lower =
                message.toLowerCase();


            if (
                lower.includes(
                    "already registered"
                )
            ) {

                message =
                    "این ایمیل قبلاً ثبت شده است.";
            }


            if (
                lower.includes("duplicate")
            ) {

                message =
                    "این نام کاربری قبلاً استفاده شده است.";
            }


            if (
                lower.includes(
                    "database error"
                )
            ) {

                message =
                    "خطای پایگاه داده. Trigger و جدول profiles را بررسی کن.";
            }


            formMessage.textContent =
                message;

            formMessage.className =
                "message error";

            showToast(
                message
            );

        } finally {

            submitBtn.disabled = false;
            submitBtn.textContent =
                "ساخت حساب";
        }

    }
);
</script>

</body>
</html>
